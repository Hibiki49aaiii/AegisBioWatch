name: artifact archaeology

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  search-artifacts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Search all retained Actions artifacts by certified hashes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, urllib.request, zipfile, io
          from pathlib import Path

          repo=os.environ['GH_REPO']; token=os.environ['GH_TOKEN']
          headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          def get_json(url):
            req=urllib.request.Request(url,headers=headers)
            with urllib.request.urlopen(req) as r: return json.load(r)
          def get_bytes(url):
            req=urllib.request.Request(url,headers=headers)
            with urllib.request.urlopen(req) as r: return r.read()

          targets={
            'r11_pcb':'f31211be596c4435faa7bdf116bc16239b70e668b6e9377ef26f0909ebce19e2',
          }
          for mprefix,mpath,key in [
            ('r7','hardware/main-board/kicad/native-r7-payload/manifest.json','materialized_files'),
            ('r8','hardware/main-board/kicad/native-r8-patch/manifest.json','final_files'),
          ]:
            m=json.loads(Path(mpath).read_text())
            for fn,meta in m[key].items():
              if meta and meta.get('sha256'): targets[f'{mprefix}:{fn}']=meta['sha256']
          reverse={v:k for k,v in targets.items()}
          matches=[]; artifacts=[]
          page=1
          while True:
            data=get_json(f'https://api.github.com/repos/{repo}/actions/artifacts?per_page=100&page={page}')
            batch=data.get('artifacts',[])
            if not batch: break
            artifacts.extend(batch); page+=1
          print(f'artifacts_retained={len(artifacts)} targets={len(targets)}')
          for i,a in enumerate(artifacts,1):
            if a.get('expired'): continue
            try:
              raw=get_bytes(a['archive_download_url'])
              with zipfile.ZipFile(io.BytesIO(raw)) as z:
                for zi in z.infolist():
                  if zi.is_dir(): continue
                  b=z.read(zi)
                  h=hashlib.sha256(b).hexdigest()
                  if h in reverse:
                    rec={'artifact_id':a['id'],'artifact_name':a['name'],'run_id':a.get('workflow_run',{}).get('id'),'path':zi.filename,'bytes':len(b),'sha256':h,'target':reverse[h]}
                    matches.append(rec); print('MATCH',json.dumps(rec))
            except Exception as e:
              print(f'artifact_error id={a.get("id")} name={a.get("name")} error={e}')
          report={'artifacts_scanned':len(artifacts),'targets':targets,'matches':matches}
          Path('/tmp/artifact-archaeology.json').write_text(json.dumps(report,indent=2))
          print(json.dumps({'artifacts_scanned':len(artifacts),'match_count':len(matches),'matches':matches},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: artifact-archaeology-report
          path: /tmp/artifact-archaeology.json
