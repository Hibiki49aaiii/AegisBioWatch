name: r13 route1i PVSS trees validation

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - '.github/workflows/r13-route1i-pvss-trees-validation.yml'
      - 'tools/materialize-pcb-r13-route1i-pvss-trees.py'
      - 'tools/write-pcb-r13-route1i-report.py'
      - 'tools/audit-pcb-pin-nets.py'
  push:
    branches: [agent/phase1-mainboard-schematic]
    paths:
      - '.github/workflows/r13-route1i-pvss-trees-validation.yml'
      - 'tools/materialize-pcb-r13-route1i-pvss-trees.py'
      - 'tools/write-pcb-r13-route1i-report.py'
      - 'tools/audit-pcb-pin-nets.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install KiCad 9.0.9
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository --yes ppa:kicad/kicad-9.0-releases
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends kicad kicad-footprints unzip
          test "$(kicad-cli --version | head -n1)" = "9.0.9"

      - name: Restore accepted route1h same-run baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9040996689/zip" \
            -o /tmp/route1h.zip
          rm -rf /tmp/route1h-artifact
          mkdir -p /tmp/route1h-artifact hardware/main-board/pcb/route-r13-1h
          unzip -q /tmp/route1h.zip -d /tmp/route1h-artifact
          cp "$(find /tmp/route1h-artifact -name 'AegisBioWatch-MainBoard-Route1h-r13.kicad_pcb' -print -quit)" hardware/main-board/pcb/route-r13-1h/AegisBioWatch-MainBoard-Route1h-r13.kicad_pcb
          cp "$(find /tmp/route1h-artifact -name 'AegisBioWatch-MainBoard-Route1h-r13.kicad_pro' -print -quit)" hardware/main-board/pcb/route-r13-1h/AegisBioWatch-MainBoard-Route1h-r13.kicad_pro
          cp "$(find /tmp/route1h-artifact -name 'routing-seed-r13-1h.json' -print -quit)" hardware/main-board/pcb/route-r13-1h/routing-seed-r13-1h.json
          cp "$(find /tmp/route1h-artifact -name 'route1h.json' -print -quit)" /tmp/route1h.json
          cp "$(find /tmp/route1h-artifact -name 'route1h-audit.json' -print -quit)" /tmp/route1h-audit.json
          cp "$(find /tmp/route1h-artifact -name 'route1h-summary.json' -print -quit)" /tmp/route1h-summary.json
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          pcb=Path('hardware/main-board/pcb/route-r13-1h/AegisBioWatch-MainBoard-Route1h-r13.kicad_pcb')
          rep=json.load(open('hardware/main-board/pcb/route-r13-1h/routing-seed-r13-1h.json'))
          drc=json.load(open('/tmp/route1h.json')); audit=json.load(open('/tmp/route1h-audit.json')); summary=json.load(open('/tmp/route1h-summary.json'))
          h=hashlib.sha256(pcb.read_bytes()).hexdigest()
          if h!='183cd620cc2a9e9fa74191a7400f4b24f4c902664ec6750189530c92743f2d8c': raise SystemExit('route1h same-run PCB SHA gate failed')
          if rep.get('output_sha256')!=h: raise SystemExit('route1h report/PCB SHA gate failed')
          if len(drc.get('violations',[]))!=0 or len(drc.get('unconnected_items',[]))!=176: raise SystemExit('route1h DRC gate failed')
          if audit.get('result')!='PASS' or audit.get('audited_present_source_nodes')!=268: raise SystemExit('route1h audit gate failed')
          if summary.get('rule_violations')!=0 or summary.get('unconnected_items')!=176: raise SystemExit('route1h summary gate failed')
          print({'route1h_sha256':h,'violations':0,'unconnected':176,'audit':'PASS'})
          PY

      - name: Materialize route1i PVSS trees
        run: |
          python3 -X faulthandler tools/materialize-pcb-r13-route1i-pvss-trees.py \
            --route1h-drc-json /tmp/route1h.json \
            --route1h-pin-net-audit /tmp/route1h-audit.json

      - name: KiCad route1i DRC and audit
        run: |
          kicad-cli pcb drc --format json --severity-all -o /tmp/route1i.json hardware/main-board/pcb/route-r13-1i/AegisBioWatch-MainBoard-Route1i-r13.kicad_pcb
          python3 tools/audit-pcb-pin-nets.py \
            --xml hardware/main-board/kicad/recovered-r8/AegisBioWatch-MainBoard-r8-recovered.xml \
            --pcb hardware/main-board/pcb/route-r13-1i/AegisBioWatch-MainBoard-Route1i-r13.kicad_pcb \
            --output /tmp/route1i-audit.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.load(open('/tmp/route1i.json')); a=json.load(open('/tmp/route1i-audit.json')); r=json.load(open('hardware/main-board/pcb/route-r13-1i/routing-seed-r13-1i.json'))
          out={
            'rule_violations':len(d.get('violations',[])),
            'unconnected_items':len(d.get('unconnected_items',[])),
            'pin_net_audit':a.get('result'),
            'audited_nodes':a.get('audited_present_source_nodes'),
            'added_segments':r.get('track_segments_added'),
            'vias_added':r.get('vias_added'),
            'component_moves':r.get('component_moves'),
          }
          print(json.dumps(out,indent=2)); Path('/tmp/route1i-summary.json').write_text(json.dumps(out,indent=2))
          if out['rule_violations']!=0 or out['unconnected_items']!=172: raise SystemExit('route1i DRC/ratsnest gate failed')
          if out['pin_net_audit']!='PASS' or out['audited_nodes']!=268: raise SystemExit('route1i audit gate failed')
          if out['added_segments']!=6 or out['vias_added']!=2 or out['component_moves']!=[]: raise SystemExit('route1i scope gate failed')
          PY

      - name: Package route1i evidence
        if: always()
        run: |
          mkdir -p /tmp/e
          for f in \
            hardware/main-board/pcb/route-r13-1i/AegisBioWatch-MainBoard-Route1i-r13.kicad_pcb \
            hardware/main-board/pcb/route-r13-1i/AegisBioWatch-MainBoard-Route1i-r13.kicad_pro \
            hardware/main-board/pcb/route-r13-1i/routing-seed-r13-1i.json \
            /tmp/route1i.json \
            /tmp/route1i-summary.json \
            /tmp/route1i-audit.json; do
            test -f "$f" && cp "$f" /tmp/e/
          done
          sha256sum /tmp/e/* > /tmp/e/SHA256SUMS.txt || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r13-route1i-pvss-trees-evidence
          path: /tmp/e/**
          if-no-files-found: warn
