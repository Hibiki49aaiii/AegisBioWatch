name: r13 route1d VOUT1 validation
on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
  push:
    branches: [agent/phase1-mainboard-schematic]
    paths:
      - '.github/workflows/r13-route1d-vout1-validation.yml'
      - 'tools/audit-pcb-pin-nets.py'
      - 'tools/materialize-pcb-r13-route1b-recovered.py'
      - 'tools/materialize-pcb-r13-route1c-gnd-plane.py'
      - 'tools/materialize-pcb-r13-route1d-vout1.py'
      - 'tools/materialize-pcb-r13-recovered.py'
      - 'tools/recover-r8-netlist-from-legacy.py'
      - 'tools/rebuild-pcb-r11-from-r8-r10.py'
      - 'tools/rebuild-pcb-r11-recovered.py'
      - 'hardware/main-board/kicad/capture/**'
      - 'hardware/main-board/kicad/generated/BOM-r8.csv'
      - 'hardware/main-board/pcb/AegisBioWatch-MainBoard-Floorplan-r10.kicad_pcb'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install KiCad 9.0.9
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository --yes ppa:kicad/kicad-9.0-releases
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends kicad kicad-footprints
          test "$(kicad-cli --version | head -n1)" = "9.0.9"
      - name: Reproduce r11 r13 route1b route1c
        run: |
          python3 tools/recover-r8-netlist-from-legacy.py
          python3 tools/rebuild-pcb-r11-recovered.py --netlist hardware/main-board/kicad/recovered-r8/AegisBioWatch-MainBoard-r8-recovered.xml
          kicad-cli pcb drc --format json --severity-all -o /tmp/r11.json hardware/main-board/pcb/placement-r11-rebuilt/AegisBioWatch-MainBoard-PlacementSeed-r11-rebuilt.kicad_pcb
          python3 tools/audit-pcb-pin-nets.py --xml hardware/main-board/kicad/recovered-r8/AegisBioWatch-MainBoard-r8-recovered.xml --pcb hardware/main-board/pcb/placement-r11-rebuilt/AegisBioWatch-MainBoard-PlacementSeed-r11-rebuilt.kicad_pcb --output /tmp/r11-audit.json
          python3 - <<'PY'
          import json; from pathlib import Path
          d=json.load(open('/tmp/r11.json')); s={'rule_violations':len(d.get('violations',[])),'unconnected_items':len(d.get('unconnected_items',[]))}; Path('/tmp/r11-summary.json').write_text(json.dumps(s)); print('r11',s)
          if s!={'rule_violations':0,'unconnected_items':186}: raise SystemExit('r11 gate failed')
          PY
          python3 tools/materialize-pcb-r13-recovered.py --drc-summary /tmp/r11-summary.json --pin-net-audit /tmp/r11-audit.json
          kicad-cli pcb drc --format json --severity-all -o /tmp/r13.json hardware/main-board/pcb/placement-r13/AegisBioWatch-MainBoard-Placement-r13.kicad_pcb
          python3 tools/audit-pcb-pin-nets.py --xml hardware/main-board/kicad/recovered-r8/AegisBioWatch-MainBoard-r8-recovered.xml --pcb hardware/main-board/pcb/placement-r13/AegisBioWatch-MainBoard-Placement-r13.kicad_pcb --output /tmp/r13-audit.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/r13.json'))
          if len(d.get('violations',[]))!=0 or len(d.get('unconnected_items',[]))!=186: raise SystemExit('r13 gate failed')
          PY
          python3 tools/materialize-pcb-r13-route1b-recovered.py --placement-drc-json /tmp/r13.json --placement-pin-net-audit /tmp/r13-audit.json
          kicad-cli pcb drc --format json --severity-all -o /tmp/route1b.json hardware/main-board/pcb/route-r13-1b/AegisBioWatch-MainBoard-Route1b-r13.kicad_pcb
          python3 tools/audit-pcb-pin-nets.py --xml hardware/main-board/kicad/recovered-r8/AegisBioWatch-MainBoard-r8-recovered.xml --pcb hardware/main-board/pcb/route-r13-1b/AegisBioWatch-MainBoard-Route1b-r13.kicad_pcb --output /tmp/route1b-audit.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/route1b.json'))
          if len(d.get('violations',[]))!=0 or len(d.get('unconnected_items',[]))!=184: raise SystemExit('route1b gate failed')
          PY
          python3 tools/materialize-pcb-r13-route1c-gnd-plane.py --route1b-drc-json /tmp/route1b.json --route1b-pin-net-audit /tmp/route1b-audit.json
          kicad-cli pcb drc --format json --severity-all -o /tmp/route1c.json hardware/main-board/pcb/route-r13-1c/AegisBioWatch-MainBoard-Route1c-r13.kicad_pcb
          python3 tools/audit-pcb-pin-nets.py --xml hardware/main-board/kicad/recovered-r8/AegisBioWatch-MainBoard-r8-recovered.xml --pcb hardware/main-board/pcb/route-r13-1c/AegisBioWatch-MainBoard-Route1c-r13.kicad_pcb --output /tmp/route1c-audit.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/route1c.json'))
          if len(d.get('violations',[]))!=0 or len(d.get('unconnected_items',[]))!=184: raise SystemExit('route1c gate failed')
          PY
      - name: Materialize route1d VOUT1
        run: python3 tools/materialize-pcb-r13-route1d-vout1.py --route1c-drc-json /tmp/route1c.json --route1c-pin-net-audit /tmp/route1c-audit.json
      - name: KiCad route1d DRC
        run: |
          kicad-cli pcb drc --format json --severity-all -o /tmp/route1d.json hardware/main-board/pcb/route-r13-1d/AegisBioWatch-MainBoard-Route1d-r13.kicad_pcb
          python3 tools/audit-pcb-pin-nets.py --xml hardware/main-board/kicad/recovered-r8/AegisBioWatch-MainBoard-r8-recovered.xml --pcb hardware/main-board/pcb/route-r13-1d/AegisBioWatch-MainBoard-Route1d-r13.kicad_pcb --output /tmp/route1d-audit.json
          python3 - <<'PY'
          import json; from pathlib import Path
          d=json.load(open('/tmp/route1d.json')); a=json.load(open('/tmp/route1d-audit.json')); r=json.load(open('hardware/main-board/pcb/route-r13-1d/routing-seed-r13-1d.json'))
          out={'rule_violations':len(d.get('violations',[])),'unconnected_items':len(d.get('unconnected_items',[])),'pin_net_audit':a.get('result'),'segments_added':r['track_segments_added'],'vias_added':r['vias_added']}
          print(json.dumps(out,indent=2)); Path('/tmp/route1d-summary.json').write_text(json.dumps(out,indent=2))
          if out['rule_violations']!=0: raise SystemExit('route1d has rule violations')
          if out['unconnected_items']>=184: raise SystemExit('route1d did not reduce ratsnest')
          if out['pin_net_audit']!='PASS' or out['segments_added']!=2 or out['vias_added']!=0: raise SystemExit('route1d scope/audit failed')
          PY
      - name: Package evidence
        if: always()
        run: |
          mkdir -p /tmp/e
          for f in hardware/main-board/pcb/route-r13-1d/AegisBioWatch-MainBoard-Route1d-r13.kicad_pcb hardware/main-board/pcb/route-r13-1d/routing-seed-r13-1d.json /tmp/route1d.json /tmp/route1d-summary.json /tmp/route1d-audit.json; do test -f "$f" && cp "$f" /tmp/e/; done
          sha256sum /tmp/e/* > /tmp/e/SHA256SUMS.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r13-route1d-vout1-evidence
          path: /tmp/e/**
