name: legacy capture KiCad probe

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
  push:
    branches: [agent/phase1-mainboard-schematic]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install KiCad 9.0.9 with symbols
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository --yes ppa:kicad/kicad-9.0-releases
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends kicad kicad-symbols
          test "$(kicad-cli --version | head -n1)" = "9.0.9"
          test -f /usr/share/kicad/symbols/Device.kicad_sym
      - name: Upgrade project legacy symbol library
        shell: bash
        run: |
          set -euxo pipefail
          cd hardware/main-board/kicad/capture
          kicad-cli sym upgrade --output AegisBioWatch.kicad_sym AegisBioWatch.lib
          cat > sym-lib-table <<'EOF'
          (sym_lib_table
            (version 7)
            (lib (name "AegisBioWatch")(type "KiCad")(uri "${KIPRJMOD}/AegisBioWatch.kicad_sym")(options "")(descr "Recovered project symbols"))
            (lib (name "Device")(type "KiCad")(uri "/usr/share/kicad/symbols/Device.kicad_sym")(options "")(descr "KiCad Device"))
            (lib (name "Connector_Generic")(type "KiCad")(uri "/usr/share/kicad/symbols/Connector_Generic.kicad_sym")(options "")(descr "KiCad Connector_Generic"))
            (lib (name "Transistor_FET")(type "KiCad")(uri "/usr/share/kicad/symbols/Transistor_FET.kicad_sym")(options "")(descr "KiCad Transistor_FET"))
          )
          EOF
      - name: Probe legacy schematic netlist export
        shell: bash
        run: |
          set +e
          mkdir -p /tmp/legacy-netlists
          : > /tmp/legacy-probe.log
          for f in hardware/main-board/kicad/capture/*.sch; do
            b="$(basename "$f" .sch)"
            echo "=== $f ===" | tee -a /tmp/legacy-probe.log
            kicad-cli sch export netlist --format kicadxml -o "/tmp/legacy-netlists/$b.xml" "$f" >>/tmp/legacy-probe.log 2>&1
            rc=$?
            echo "rc=$rc" | tee -a /tmp/legacy-probe.log
            if [ -s "/tmp/legacy-netlists/$b.xml" ]; then
              python3 -c 'import sys,xml.etree.ElementTree as ET; r=ET.parse(sys.argv[1]).getroot(); cs=r.findall("./components/comp"); ns=r.findall("./nets/net"); print("components=",len(cs),"nets=",len(ns),"nodes=",sum(len(n.findall("node")) for n in ns))' "/tmp/legacy-netlists/$b.xml" | tee -a /tmp/legacy-probe.log
            fi
          done
          cat /tmp/legacy-probe.log
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: legacy-capture-kicad-probe
          path: |
            /tmp/legacy-probe.log
            /tmp/legacy-netlists/**
            hardware/main-board/kicad/capture/AegisBioWatch.kicad_sym
            hardware/main-board/kicad/capture/sym-lib-table
