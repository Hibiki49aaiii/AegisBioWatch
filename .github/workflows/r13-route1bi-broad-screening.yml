name: r13 route1bi broad candidate screening

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - '.github/workflows/r13-route1bi-broad-screening.yml'
      - 'tools/reproduce-route1bg-accepted.sh'
      - 'tools/probe-pcb-r13-route1bi-broad.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screen:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install KiCad 9.0.9
        timeout-minutes: 45
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt
            test -s /etc/apt/apt-mirrors.txt
          fi
          sudo apt-get -o Acquire::Retries=5 update
          sudo apt-get -o Acquire::Retries=5 install -y software-properties-common
          sudo add-apt-repository --yes ppa:kicad/kicad-9.0-releases
          sudo apt-get -o Acquire::Retries=5 update
          sudo apt-get -o Acquire::Retries=5 install -y --no-install-recommends kicad kicad-footprints
          test "$(kicad-cli --version | head -n1)" = "9.0.9"

      - name: Reproduce accepted route1bg
        run: bash tools/reproduce-route1bg-accepted.sh

      - name: Broad-screen ordinary route1bi direct candidates
        run: |
          python3 tools/probe-pcb-r13-route1bi-broad.py             --route1bg-drc-json /tmp/route1bg.json             --route1bg-pin-net-audit /tmp/route1bg-audit.json             --output /tmp/route1bi-broad.json
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/route1bi-broad.json'))
          assert x['source_gate']=={'rule_violations':0,'unconnected_items':116,'pin_net_audit':'PASS','audited_nodes':268}
          assert x['board_modified'] is False
          assert x['raw_pair_count']>=100
          print('PASSING_COUNT',x['passing_count'])
          for i,c in enumerate(x['passing_candidates'][:20],1):
              print(i,c['drc_index'],c['net'],c['a']['description'],'->',c['b']['description'],'len',c['length_mm'],'clr',c['minimum_conservative_clearance_mm'])
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: r13-route1bi-broad-screen
          path: /tmp/route1bi-broad.json
          if-no-files-found: error
