name: engineering source snapshot

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: aegis-engineering-source-snapshot
          if-no-files-found: error
          path: |
            docs/**
            hardware/main-board/design/**
            hardware/main-board/kicad/**
            hardware/main-board/pcb/**
            tools/**
