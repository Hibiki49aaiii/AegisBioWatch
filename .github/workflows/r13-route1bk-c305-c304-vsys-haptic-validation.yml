name: r13 route1bk C305-C304 VSYS_HAPTIC validation

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - '.github/workflows/r13-route1bk-c305-c304-vsys-haptic-validation.yml'
      - 'tools/reproduce-route1bj-accepted.sh'
      - 'tools/probe-pcb-r13-route1bk-doglegs.py'
      - 'tools/probe-pcb-r13-route1bk-c305-c304-vsys-haptic.py'
      - 'tools/materialize-pcb-r13-route1bk-c305-c304-vsys-haptic.py'
      - 'tools/write-pcb-r13-route1bk-report.py'
      - 'tools/audit-pcb-pin-nets.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install KiCad 9.0.9
        timeout-minutes: 45
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt
            test -s /etc/apt/apt-mirrors.txt
          fi
          sudo apt-get -o Acquire::Retries=5 update
          sudo apt-get -o Acquire::Retries=5 install -y software-properties-common
          sudo add-apt-repository --yes ppa:kicad/kicad-9.0-releases
          sudo apt-get -o Acquire::Retries=5 update
          sudo apt-get -o Acquire::Retries=5 install -y --no-install-recommends kicad kicad-footprints
          test "$(kicad-cli --version | head -n1)" = "9.0.9"

      - name: Reproduce accepted route1bj
        run: bash tools/reproduce-route1bj-accepted.sh

      - name: Re-run current-state route1bk screen
        run: |
          python3 tools/probe-pcb-r13-route1bk-doglegs.py             --route1bj-drc-json /tmp/route1bj.json             --route1bj-pin-net-audit /tmp/route1bj-audit.json             --output /tmp/route1bk-doglegs.json

      - name: Run exact C305-C304 route1bk probe
        run: |
          python3 tools/probe-pcb-r13-route1bk-c305-c304-vsys-haptic.py             --route1bj-drc-json /tmp/route1bj.json             --route1bj-pin-net-audit /tmp/route1bj-audit.json             --dogleg-screen-json /tmp/route1bk-doglegs.json             --output /tmp/route1bk-probe.json

      - name: Materialize route1bk
        run: |
          python3 -X faulthandler tools/materialize-pcb-r13-route1bk-c305-c304-vsys-haptic.py             --route1bj-drc-json /tmp/route1bj.json             --route1bj-pin-net-audit /tmp/route1bj-audit.json             --exact-probe-json /tmp/route1bk-probe.json

      - name: Validate route1bk
        run: |
          kicad-cli pcb drc --format json --severity-all             -o /tmp/route1bk.json             hardware/main-board/pcb/route-r13-1bk/AegisBioWatch-MainBoard-Route1bk-r13.kicad_pcb

          python3 tools/audit-pcb-pin-nets.py             --xml hardware/main-board/kicad/recovered-r8/AegisBioWatch-MainBoard-r8-recovered.xml             --pcb hardware/main-board/pcb/route-r13-1bk/AegisBioWatch-MainBoard-Route1bk-r13.kicad_pcb             --output /tmp/route1bk-audit.json

          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path

          d=json.load(open('/tmp/route1bk.json'))
          a=json.load(open('/tmp/route1bk-audit.json'))
          p=json.load(open('/tmp/route1bk-probe.json'))
          s=json.load(open('/tmp/route1bk-doglegs.json'))
          r=json.load(open('hardware/main-board/pcb/route-r13-1bk/routing-seed-r13-1bk.json'))
          c=r['connections']['C305.1/VSYS_HAPTIC to C304.1/VSYS_HAPTIC']
          pcb=Path('hardware/main-board/pcb/route-r13-1bk/AegisBioWatch-MainBoard-Route1bk-r13.kicad_pcb')

          out={
            'rule_violations':len(d.get('violations',[])),
            'unconnected_items':len(d.get('unconnected_items',[])),
            'pin_net_audit':a.get('result'),
            'audited_nodes':a.get('audited_present_source_nodes'),
            'probe_board_modified':p.get('board_modified'),
            'probe_min_clearance_mm':p.get('path',{}).get('minimum_conservative_clearance_mm'),
            'probe_gnd_via_gap_mm':p.get('path',{}).get('independent_gnd_via_gap_mm'),
            'screen_board_modified':s.get('board_modified'),
            'screen_grid_mm':s.get('grid_mm'),
            'segments_added':r.get('track_segments_added'),
            'vias_added':r.get('vias_added'),
            'track_width_mm':r.get('track_width_mm'),
            'segment_lengths_mm':r.get('segment_lengths_mm'),
            'track_length_mm':r.get('track_length_mm'),
            'component_moves':r.get('component_moves'),
            'component_rotations':r.get('component_rotations'),
            'c305_value':c.get('c305_value'),
            'c304_value':c.get('c304_value'),
            'path_points_mm':c.get('path_points_mm'),
            'c305_pad1_mm':c.get('c305_pad1_mm'),
            'c305_pad1_net':c.get('c305_pad1_net'),
            'c305_pad2_mm':c.get('c305_pad2_mm'),
            'c305_pad2_net':c.get('c305_pad2_net'),
            'c304_pad1_mm':c.get('c304_pad1_mm'),
            'c304_pad1_net':c.get('c304_pad1_net'),
            'c304_pad2_mm':c.get('c304_pad2_mm'),
            'c304_pad2_net':c.get('c304_pad2_net'),
            'u4_value':c.get('u4_value'),
            'u4_pad10_mm':c.get('u4_pad10_mm'),
            'u4_pad10_net':c.get('u4_pad10_net'),
            'r305_value':c.get('r305_value'),
            'r305_pad2_mm':c.get('r305_pad2_mm'),
            'r305_pad2_net':c.get('r305_pad2_net'),
            'c305_gnd_routing_touched':r.get('c305_gnd_routing_touched'),
            'c304_gnd_routing_touched':r.get('c304_gnd_routing_touched'),
            'u4_vdd_routing_touched':r.get('u4_vdd_routing_touched'),
            'r305_feed_routing_touched':r.get('r305_feed_routing_touched'),
            'accepted_route1bj_geometry_modified':r.get('accepted_route1bj_geometry_modified'),
            'rf_routing_touched':r.get('rf_routing_touched'),
            'supplier_gated_interfaces_touched':r.get('supplier_gated_interfaces_touched'),
            'pcb_sha256':hashlib.sha256(pcb.read_bytes()).hexdigest()
          }
          print(json.dumps(out,indent=2))
          Path('/tmp/route1bk-summary.json').write_text(json.dumps(out,indent=2)+'\n')

          assert out['rule_violations']==0 and out['unconnected_items']==113
          assert out['pin_net_audit']=='PASS' and out['audited_nodes']==268
          assert out['probe_board_modified'] is False and out['screen_board_modified'] is False
          assert abs(out['screen_grid_mm']-0.05)<1e-9
          assert abs(out['probe_min_clearance_mm']-0.125)<1e-6
          assert abs(out['probe_gnd_via_gap_mm']-0.125)<1e-6
          assert out['segments_added']==3 and out['vias_added']==0
          assert out['track_width_mm']==0.30
          assert out['segment_lengths_mm']==[0.685,9.2,2.075]
          assert abs(out['track_length_mm']-11.96)<1e-6
          assert out['component_moves']==[] and out['component_rotations']==[]
          assert out['c305_value']=='1uF' and out['c304_value']=='100nF'
          assert out['path_points_mm']==[[6.805,22.335],[6.805,21.65],[16.005,21.65],[16.005,23.725]]
          assert out['c305_pad1_mm']==[6.805,22.335] and out['c305_pad1_net']=='VSYS_HAPTIC'
          assert out['c305_pad2_mm']==[7.765,22.335] and out['c305_pad2_net']=='GND'
          assert out['c304_pad1_mm']==[16.005,23.725] and out['c304_pad1_net']=='VSYS_HAPTIC'
          assert out['c304_pad2_mm']==[16.645,23.725] and out['c304_pad2_net']=='GND'
          assert out['u4_value']=='DRV2605LDGSR'
          assert out['u4_pad10_mm']==[23.005,13.4] and out['u4_pad10_net']=='VSYS_HAPTIC'
          assert out['r305_value']=='0R / FB OPTION'
          assert out['r305_pad2_mm']==[31.315,18.595] and out['r305_pad2_net']=='VSYS_HAPTIC'
          assert out['c305_gnd_routing_touched'] is False
          assert out['c304_gnd_routing_touched'] is False
          assert out['u4_vdd_routing_touched'] is False
          assert out['r305_feed_routing_touched'] is False
          assert out['accepted_route1bj_geometry_modified'] is False
          assert out['rf_routing_touched'] is False
          assert out['supplier_gated_interfaces_touched'] is False
          assert r.get('output_sha256')==out['pcb_sha256']
          PY

      - name: Package route1bk evidence
        run: |
          mkdir -p /tmp/e
          cp hardware/main-board/pcb/route-r13-1bk/AegisBioWatch-MainBoard-Route1bk-r13.kicad_pcb /tmp/e/
          cp hardware/main-board/pcb/route-r13-1bk/AegisBioWatch-MainBoard-Route1bk-r13.kicad_pro /tmp/e/
          cp hardware/main-board/pcb/route-r13-1bk/routing-seed-r13-1bk.json /tmp/e/
          cp /tmp/route1bk.json /tmp/e/
          cp /tmp/route1bk-audit.json /tmp/e/
          cp /tmp/route1bk-summary.json /tmp/e/
          cp /tmp/route1bk-probe.json /tmp/e/
          cp /tmp/route1bk-doglegs.json /tmp/e/
          (cd /tmp/e && sha256sum             AegisBioWatch-MainBoard-Route1bk-r13.kicad_pcb             AegisBioWatch-MainBoard-Route1bk-r13.kicad_pro             routing-seed-r13-1bk.json             route1bk.json route1bk-audit.json route1bk-summary.json             route1bk-probe.json route1bk-doglegs.json > SHA256SUMS.txt)
          cat /tmp/e/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: r13-route1bk-c305-c304-vsys-haptic-evidence
          path: /tmp/e/**
          if-no-files-found: error

  verify-artifact:
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: r13-route1bk-c305-c304-vsys-haptic-evidence
          path: /tmp/e

      - name: Verify downloaded route1bk evidence
        run: |
          cd /tmp/e
          sha256sum -c SHA256SUMS.txt
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('/tmp/e')
          d=json.loads((root/'route1bk.json').read_text())
          a=json.loads((root/'route1bk-audit.json').read_text())
          s=json.loads((root/'route1bk-summary.json').read_text())
          p=json.loads((root/'route1bk-probe.json').read_text())
          r=json.loads((root/'routing-seed-r13-1bk.json').read_text())
          pcb=root/'AegisBioWatch-MainBoard-Route1bk-r13.kicad_pcb'

          assert len(d.get('violations',[]))==0
          assert len(d.get('unconnected_items',[]))==113
          assert a.get('result')=='PASS' and a.get('audited_present_source_nodes')==268
          assert s.get('rule_violations')==0 and s.get('unconnected_items')==113
          assert s.get('pin_net_audit')=='PASS' and s.get('audited_nodes')==268
          assert p.get('board_modified') is False
          assert abs(p.get('path',{}).get('minimum_conservative_clearance_mm')-0.125)<1e-6
          assert abs(p.get('path',{}).get('independent_gnd_via_gap_mm')-0.125)<1e-6
          assert r.get('track_segments_added')==3 and r.get('vias_added')==0
          assert r.get('segment_lengths_mm')==[0.685,9.2,2.075]
          assert abs(r.get('track_length_mm')-11.96)<1e-6
          assert r.get('output_sha256')==hashlib.sha256(pcb.read_bytes()).hexdigest()
          print(json.dumps({
            'artifact_verify':'PASS',
            'rule_violations':0,
            'unconnected_items':113,
            'pin_net_audit':'PASS',
            'audited_nodes':268,
            'minimum_conservative_clearance_mm':p.get('path',{}).get('minimum_conservative_clearance_mm'),
            'independent_gnd_via_gap_mm':p.get('path',{}).get('independent_gnd_via_gap_mm'),
            'pcb_sha256':r.get('output_sha256')
          },indent=2))
          PY
