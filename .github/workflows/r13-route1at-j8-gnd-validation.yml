name: r13 route1at J8 GND validation

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - '.github/workflows/r13-route1at-j8-gnd-validation.yml'
      - 'tools/reproduce-route1as-accepted.sh'
      - 'tools/materialize-pcb-r13-route1at-j8-gnd.py'
      - 'tools/write-pcb-r13-route1at-report.py'
      - 'tools/audit-pcb-pin-nets.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install KiCad 9.0.9
        timeout-minutes: 45
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt
            test -s /etc/apt/apt-mirrors.txt
          fi
          sudo apt-get -o Acquire::Retries=5 update
          sudo apt-get -o Acquire::Retries=5 install -y software-properties-common
          sudo add-apt-repository --yes ppa:kicad/kicad-9.0-releases
          sudo apt-get -o Acquire::Retries=5 update
          sudo apt-get -o Acquire::Retries=5 install -y --no-install-recommends kicad kicad-footprints
          test "$(kicad-cli --version | head -n1)" = "9.0.9"
      - name: Reproduce and validate accepted route1as baseline
        run: bash tools/reproduce-route1as-accepted.sh
      - name: Materialize route1at J8 GND closure
        run: |
          python3 -X faulthandler tools/materialize-pcb-r13-route1at-j8-gnd.py \
            --route1as-drc-json /tmp/route1as.json \
            --route1as-pin-net-audit /tmp/route1as-audit.json
      - name: KiCad route1at DRC and audit
        run: |
          kicad-cli pcb drc --format json --severity-all -o /tmp/route1at.json hardware/main-board/pcb/route-r13-1at/AegisBioWatch-MainBoard-Route1at-r13.kicad_pcb
          python3 tools/audit-pcb-pin-nets.py \
            --xml hardware/main-board/kicad/recovered-r8/AegisBioWatch-MainBoard-r8-recovered.xml \
            --pcb hardware/main-board/pcb/route-r13-1at/AegisBioWatch-MainBoard-Route1at-r13.kicad_pcb \
            --output /tmp/route1at-audit.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.load(open('/tmp/route1at.json'))
          a=json.load(open('/tmp/route1at-audit.json'))
          r=json.load(open('hardware/main-board/pcb/route-r13-1at/routing-seed-r13-1at.json'))
          c=r.get('connections',{}).get('J8.5/GND',{})
          out={
            'rule_violations':len(d.get('violations',[])),
            'unconnected_items':len(d.get('unconnected_items',[])),
            'pin_net_audit':a.get('result'),
            'audited_nodes':a.get('audited_present_source_nodes'),
            'added_segments':r.get('track_segments_added'),
            'vias_added':r.get('vias_added'),
            'component_moves':r.get('component_moves'),
            'component_rotations':r.get('component_rotations'),
            'j8_value':c.get('j8_value'),
            'j8_1_net':c.get('j8_1_net'),
            'j8_2_net':c.get('j8_2_net'),
            'j8_3_net':c.get('j8_3_net'),
            'j8_4_net':c.get('j8_4_net'),
            'j8_5_net':c.get('j8_5_net'),
            'j8_6_net':c.get('j8_6_net'),
            'j8_5_pad_mm':c.get('pad_mm'),
            'gnd_via_mm':c.get('gnd_via_mm'),
            'accepted_route1as_geometry_modified':r.get('accepted_route1as_geometry_modified'),
            'rf_routing_touched':r.get('rf_routing_touched'),
            'supplier_gated_interfaces_touched':r.get('supplier_gated_interfaces_touched'),
          }
          print(json.dumps(out,indent=2))
          Path('/tmp/route1at-summary.json').write_text(json.dumps(out,indent=2))
          if out['rule_violations']!=0 or out['unconnected_items']!=129: raise SystemExit('route1at DRC/ratsnest gate failed')
          if out['pin_net_audit']!='PASS' or out['audited_nodes']!=268: raise SystemExit('route1at audit gate failed')
          if out['added_segments']!=1 or out['vias_added']!=1: raise SystemExit('route1at routing scope gate failed')
          if out['component_moves']!=[] or out['component_rotations']!=[]: raise SystemExit('route1at placement scope gate failed')
          expected={'j8_value':'TC2030_SWD_6','j8_1_net':'+1V8','j8_2_net':'SWDIO','j8_3_net':'NRF_RESET_N','j8_4_net':'SWDCLK','j8_5_net':'GND','j8_6_net':'SWO'}
          for key,value in expected.items():
              if out[key]!=value: raise SystemExit(f'route1at J8 identity/net gate failed: {key}={out[key]!r}')
          if out['j8_5_pad_mm'] != [14.645,15.26] or out['gnd_via_mm'] != [15.25,15.26]: raise SystemExit('route1at J8 geometry gate failed')
          if out['accepted_route1as_geometry_modified'] is not False: raise SystemExit('route1at accepted route1as geometry mutation gate failed')
          if out['rf_routing_touched'] is not False or out['supplier_gated_interfaces_touched'] is not False: raise SystemExit('route1at frozen-interface scope gate failed')
          PY
      - name: Package route1at evidence
        if: always()
        run: |
          mkdir -p /tmp/e
          for f in \
            hardware/main-board/pcb/route-r13-1at/AegisBioWatch-MainBoard-Route1at-r13.kicad_pcb \
            hardware/main-board/pcb/route-r13-1at/AegisBioWatch-MainBoard-Route1at-r13.kicad_pro \
            hardware/main-board/pcb/route-r13-1at/routing-seed-r13-1at.json \
            /tmp/route1at.json /tmp/route1at-summary.json /tmp/route1at-audit.json; do
            test -f "$f" && cp "$f" /tmp/e/
          done
          sha256sum /tmp/e/* > /tmp/e/SHA256SUMS.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r13-route1at-j8-gnd-evidence
          path: /tmp/e/**
          if-no-files-found: warn
