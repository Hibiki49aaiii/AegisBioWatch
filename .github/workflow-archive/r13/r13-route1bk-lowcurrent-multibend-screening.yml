name: r13 route1bk low-current multibend screening

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - '.github/workflows/r13-route1bk-lowcurrent-multibend-screening.yml'
      - 'tools/reproduce-route1bj-accepted.sh'
      - 'tools/probe-pcb-r13-route1bk-lowcurrent-multibend.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screen:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install KiCad 9.0.9
        timeout-minutes: 45
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt
            test -s /etc/apt/apt-mirrors.txt
          fi
          sudo apt-get -o Acquire::Retries=5 update
          sudo apt-get -o Acquire::Retries=5 install -y software-properties-common
          sudo add-apt-repository --yes ppa:kicad/kicad-9.0-releases
          sudo apt-get -o Acquire::Retries=5 update
          sudo apt-get -o Acquire::Retries=5 install -y --no-install-recommends kicad kicad-footprints
          test "$(kicad-cli --version | head -n1)" = "9.0.9"

      - name: Reproduce accepted route1bj
        run: bash tools/reproduce-route1bj-accepted.sh

      - name: Screen low-current multibend candidates
        run: |
          python3 tools/probe-pcb-r13-route1bk-lowcurrent-multibend.py             --route1bj-drc-json /tmp/route1bj.json             --route1bj-pin-net-audit /tmp/route1bj-audit.json             --output /tmp/route1bk-lowcurrent.json

          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/route1bk-lowcurrent.json'))
          assert x['source_gate']=={
            'rule_violations':0,
            'unconnected_items':114,
            'pin_net_audit':'PASS',
            'audited_nodes':268
          }
          assert x['board_modified'] is False
          for t in x['targets']:
              print(t['id'],'paths',t['candidate_path_count'],'passing',t['passing_path_count'])
              print('best',t['best_passing_path'])
              print('best_clearance',t['best_clearance_path'])
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: r13-route1bk-lowcurrent-multibend-screen
          path: /tmp/route1bk-lowcurrent.json
          if-no-files-found: error
