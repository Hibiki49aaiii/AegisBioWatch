name: r13 route1bj R404-R302 +1V8 validation

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - '.github/workflows/r13-route1bj-r404-r302-1v8-validation.yml'
      - 'tools/reproduce-route1bi-accepted.sh'
      - 'tools/probe-pcb-r13-route1bj-doglegs.py'
      - 'tools/probe-pcb-r13-route1bj-r404-r302-1v8.py'
      - 'tools/materialize-pcb-r13-route1bj-r404-r302-1v8.py'
      - 'tools/write-pcb-r13-route1bj-report.py'
      - 'tools/audit-pcb-pin-nets.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install KiCad 9.0.9
        timeout-minutes: 45
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt
            test -s /etc/apt/apt-mirrors.txt
          fi
          sudo apt-get -o Acquire::Retries=5 update
          sudo apt-get -o Acquire::Retries=5 install -y software-properties-common
          sudo add-apt-repository --yes ppa:kicad/kicad-9.0-releases
          sudo apt-get -o Acquire::Retries=5 update
          sudo apt-get -o Acquire::Retries=5 install -y --no-install-recommends kicad kicad-footprints
          test "$(kicad-cli --version | head -n1)" = "9.0.9"

      - name: Reproduce accepted route1bi
        run: bash tools/reproduce-route1bi-accepted.sh

      - name: Re-run refined route1bj dogleg screen
        run: |
          python3 tools/probe-pcb-r13-route1bj-doglegs.py             --route1bi-drc-json /tmp/route1bi.json             --route1bi-pin-net-audit /tmp/route1bi-audit.json             --output /tmp/route1bj-doglegs.json

      - name: Run exact R404-R302 route1bj probe
        run: |
          python3 tools/probe-pcb-r13-route1bj-r404-r302-1v8.py             --route1bi-drc-json /tmp/route1bi.json             --route1bi-pin-net-audit /tmp/route1bi-audit.json             --dogleg-screen-json /tmp/route1bj-doglegs.json             --output /tmp/route1bj-probe.json

      - name: Materialize route1bj
        run: |
          python3 -X faulthandler tools/materialize-pcb-r13-route1bj-r404-r302-1v8.py             --route1bi-drc-json /tmp/route1bi.json             --route1bi-pin-net-audit /tmp/route1bi-audit.json             --exact-probe-json /tmp/route1bj-probe.json

      - name: Validate route1bj
        run: |
          kicad-cli pcb drc --format json --severity-all             -o /tmp/route1bj.json             hardware/main-board/pcb/route-r13-1bj/AegisBioWatch-MainBoard-Route1bj-r13.kicad_pcb

          python3 tools/audit-pcb-pin-nets.py             --xml hardware/main-board/kicad/recovered-r8/AegisBioWatch-MainBoard-r8-recovered.xml             --pcb hardware/main-board/pcb/route-r13-1bj/AegisBioWatch-MainBoard-Route1bj-r13.kicad_pcb             --output /tmp/route1bj-audit.json

          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path

          d=json.load(open('/tmp/route1bj.json'))
          a=json.load(open('/tmp/route1bj-audit.json'))
          p=json.load(open('/tmp/route1bj-probe.json'))
          s=json.load(open('/tmp/route1bj-doglegs.json'))
          r=json.load(open('hardware/main-board/pcb/route-r13-1bj/routing-seed-r13-1bj.json'))
          c=r['connections']['R404.1/+1V8 to R302.1/+1V8']
          pcb=Path('hardware/main-board/pcb/route-r13-1bj/AegisBioWatch-MainBoard-Route1bj-r13.kicad_pcb')

          out={
            'rule_violations':len(d.get('violations',[])),
            'unconnected_items':len(d.get('unconnected_items',[])),
            'pin_net_audit':a.get('result'),
            'audited_nodes':a.get('audited_present_source_nodes'),
            'probe_board_modified':p.get('board_modified'),
            'probe_min_clearance_mm':p.get('path',{}).get('minimum_conservative_clearance_mm'),
            'probe_r501_gap_mm':p.get('path',{}).get('independent_r501_pad_gap_mm'),
            'screen_board_modified':s.get('board_modified'),
            'screen_grid_mm':s.get('grid_mm'),
            'screen_passing_candidate_count':s.get('passing_candidate_count'),
            'segments_added':r.get('track_segments_added'),
            'vias_added':r.get('vias_added'),
            'track_width_mm':r.get('track_width_mm'),
            'segment_lengths_mm':r.get('segment_lengths_mm'),
            'track_length_mm':r.get('track_length_mm'),
            'component_moves':r.get('component_moves'),
            'component_rotations':r.get('component_rotations'),
            'r404_value':c.get('r404_value'),
            'r302_value':c.get('r302_value'),
            'path_points_mm':c.get('path_points_mm'),
            'r404_pad1_mm':c.get('r404_pad1_mm'),
            'r404_pad1_net':c.get('r404_pad1_net'),
            'r404_pad2_mm':c.get('r404_pad2_mm'),
            'r404_pad2_net':c.get('r404_pad2_net'),
            'r302_pad1_mm':c.get('r302_pad1_mm'),
            'r302_pad1_net':c.get('r302_pad1_net'),
            'r302_pad2_mm':c.get('r302_pad2_mm'),
            'r302_pad2_net':c.get('r302_pad2_net'),
            'r501_pad1_mm':c.get('nearest_r501_pad1_mm'),
            'r501_pad1_net':c.get('nearest_r501_pad1_net'),
            'r404_signal_routing_touched':r.get('r404_signal_routing_touched'),
            'r302_signal_routing_touched':r.get('r302_signal_routing_touched'),
            'chg_5v_routing_touched':r.get('chg_5v_routing_touched'),
            'accepted_route1bi_geometry_modified':r.get('accepted_route1bi_geometry_modified'),
            'rf_routing_touched':r.get('rf_routing_touched'),
            'supplier_gated_interfaces_touched':r.get('supplier_gated_interfaces_touched'),
            'pcb_sha256':hashlib.sha256(pcb.read_bytes()).hexdigest()
          }
          print(json.dumps(out,indent=2))
          Path('/tmp/route1bj-summary.json').write_text(json.dumps(out,indent=2)+'\n')

          assert out['rule_violations']==0 and out['unconnected_items']==114
          assert out['pin_net_audit']=='PASS' and out['audited_nodes']==268
          assert out['probe_board_modified'] is False and out['screen_board_modified'] is False
          assert abs(out['screen_grid_mm']-0.05)<1e-9
          assert out['probe_min_clearance_mm']>=0.175-1e-6
          assert abs(out['probe_r501_gap_mm']-0.175)<1e-6
          assert out['screen_passing_candidate_count']>=1
          assert out['segments_added']==3 and out['vias_added']==0
          assert out['track_width_mm']==0.30
          assert out['segment_lengths_mm']==[0.525,4.5,0.225]
          assert abs(out['track_length_mm']-5.25)<1e-6
          assert out['component_moves']==[] and out['component_rotations']==[]
          assert out['r404_value']=='4.7k PU PROV'
          assert out['r302_value']=='47k PU'
          assert out['path_points_mm']==[[15.755,26.725],[15.755,26.2],[20.255,26.2],[20.255,25.975]]
          assert out['r404_pad1_mm']==[15.755,26.725] and out['r404_pad1_net']=='+1V8'
          assert out['r404_pad2_mm']==[16.395,26.725] and out['r404_pad2_net']=='SYS_I2C_SCL'
          assert out['r302_pad1_mm']==[20.255,25.975] and out['r302_pad1_net']=='+1V8'
          assert out['r302_pad2_mm']==[20.895,25.975] and out['r302_pad2_net']=='FLASH_HOLD_N'
          assert out['r501_pad1_mm']==[18.005,26.725] and out['r501_pad1_net']=='CHG_5V'
          assert out['r404_signal_routing_touched'] is False
          assert out['r302_signal_routing_touched'] is False
          assert out['chg_5v_routing_touched'] is False
          assert out['accepted_route1bi_geometry_modified'] is False
          assert out['rf_routing_touched'] is False
          assert out['supplier_gated_interfaces_touched'] is False
          assert r.get('output_sha256')==out['pcb_sha256']
          PY

      - name: Package route1bj evidence
        run: |
          mkdir -p /tmp/e
          cp hardware/main-board/pcb/route-r13-1bj/AegisBioWatch-MainBoard-Route1bj-r13.kicad_pcb /tmp/e/
          cp hardware/main-board/pcb/route-r13-1bj/AegisBioWatch-MainBoard-Route1bj-r13.kicad_pro /tmp/e/
          cp hardware/main-board/pcb/route-r13-1bj/routing-seed-r13-1bj.json /tmp/e/
          cp /tmp/route1bj.json /tmp/e/
          cp /tmp/route1bj-audit.json /tmp/e/
          cp /tmp/route1bj-summary.json /tmp/e/
          cp /tmp/route1bj-probe.json /tmp/e/
          cp /tmp/route1bj-doglegs.json /tmp/e/
          (cd /tmp/e && sha256sum             AegisBioWatch-MainBoard-Route1bj-r13.kicad_pcb             AegisBioWatch-MainBoard-Route1bj-r13.kicad_pro             routing-seed-r13-1bj.json             route1bj.json route1bj-audit.json route1bj-summary.json             route1bj-probe.json route1bj-doglegs.json > SHA256SUMS.txt)
          cat /tmp/e/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: r13-route1bj-r404-r302-1v8-evidence
          path: /tmp/e/**
          if-no-files-found: error

  verify-artifact:
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: r13-route1bj-r404-r302-1v8-evidence
          path: /tmp/e

      - name: Verify downloaded route1bj evidence
        run: |
          cd /tmp/e
          sha256sum -c SHA256SUMS.txt
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('/tmp/e')
          d=json.loads((root/'route1bj.json').read_text())
          a=json.loads((root/'route1bj-audit.json').read_text())
          s=json.loads((root/'route1bj-summary.json').read_text())
          p=json.loads((root/'route1bj-probe.json').read_text())
          r=json.loads((root/'routing-seed-r13-1bj.json').read_text())
          pcb=root/'AegisBioWatch-MainBoard-Route1bj-r13.kicad_pcb'

          assert len(d.get('violations',[]))==0
          assert len(d.get('unconnected_items',[]))==114
          assert a.get('result')=='PASS' and a.get('audited_present_source_nodes')==268
          assert s.get('rule_violations')==0 and s.get('unconnected_items')==114
          assert s.get('pin_net_audit')=='PASS' and s.get('audited_nodes')==268
          assert p.get('board_modified') is False
          assert p.get('path',{}).get('minimum_conservative_clearance_mm')>=0.175-1e-6
          assert abs(p.get('path',{}).get('independent_r501_pad_gap_mm')-0.175)<1e-6
          assert r.get('track_segments_added')==3 and r.get('vias_added')==0
          assert r.get('segment_lengths_mm')==[0.525,4.5,0.225]
          assert abs(r.get('track_length_mm')-5.25)<1e-6
          assert r.get('output_sha256')==hashlib.sha256(pcb.read_bytes()).hexdigest()
          print(json.dumps({
            'artifact_verify':'PASS',
            'rule_violations':0,
            'unconnected_items':114,
            'pin_net_audit':'PASS',
            'audited_nodes':268,
            'minimum_conservative_clearance_mm':p.get('path',{}).get('minimum_conservative_clearance_mm'),
            'independent_r501_pad_gap_mm':p.get('path',{}).get('independent_r501_pad_gap_mm'),
            'pcb_sha256':r.get('output_sha256')
          },indent=2))
          PY
