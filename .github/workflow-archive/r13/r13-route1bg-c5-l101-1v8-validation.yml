name: r13 route1bg C5-L101 +1V8 validation

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - '.github/workflows/r13-route1bg-c5-l101-1v8-validation.yml'
      - 'tools/reproduce-route1bf-accepted.sh'
      - 'tools/probe-pcb-r13-route1bg-c5-l101-1v8.py'
      - 'tools/materialize-pcb-r13-route1bg-c5-l101-1v8.py'
      - 'tools/write-pcb-r13-route1bg-report.py'
      - 'tools/audit-pcb-pin-nets.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install KiCad 9.0.9
        timeout-minutes: 45
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt
            test -s /etc/apt/apt-mirrors.txt
          fi
          sudo apt-get -o Acquire::Retries=5 update
          sudo apt-get -o Acquire::Retries=5 install -y software-properties-common
          sudo add-apt-repository --yes ppa:kicad/kicad-9.0-releases
          sudo apt-get -o Acquire::Retries=5 update
          sudo apt-get -o Acquire::Retries=5 install -y --no-install-recommends kicad kicad-footprints
          test "$(kicad-cli --version | head -n1)" = "9.0.9"

      - name: Reproduce accepted route1bf
        run: bash tools/reproduce-route1bf-accepted.sh

      - name: Run read-only route1bg geometry probe
        run: |
          python3 tools/probe-pcb-r13-route1bg-c5-l101-1v8.py             --route1bf-drc-json /tmp/route1bf.json             --route1bf-pin-net-audit /tmp/route1bf-audit.json             --output /tmp/route1bg-probe.json

      - name: Materialize route1bg
        run: |
          python3 -X faulthandler tools/materialize-pcb-r13-route1bg-c5-l101-1v8.py             --route1bf-drc-json /tmp/route1bf.json             --route1bf-pin-net-audit /tmp/route1bf-audit.json

      - name: Validate route1bg
        run: |
          kicad-cli pcb drc --format json --severity-all             -o /tmp/route1bg.json             hardware/main-board/pcb/route-r13-1bg/AegisBioWatch-MainBoard-Route1bg-r13.kicad_pcb

          python3 tools/audit-pcb-pin-nets.py             --xml hardware/main-board/kicad/recovered-r8/AegisBioWatch-MainBoard-r8-recovered.xml             --pcb hardware/main-board/pcb/route-r13-1bg/AegisBioWatch-MainBoard-Route1bg-r13.kicad_pcb             --output /tmp/route1bg-audit.json

          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.load(open('/tmp/route1bg.json'))
          a=json.load(open('/tmp/route1bg-audit.json'))
          p=json.load(open('/tmp/route1bg-probe.json'))
          r=json.load(open('hardware/main-board/pcb/route-r13-1bg/routing-seed-r13-1bg.json'))
          c=r['connections']['C5.1/+1V8 to L101.2/+1V8']

          out={
            'rule_violations':len(d.get('violations',[])),
            'unconnected_items':len(d.get('unconnected_items',[])),
            'pin_net_audit':a.get('result'),
            'audited_nodes':a.get('audited_present_source_nodes'),
            'probe_board_modified':p.get('board_modified'),
            'probe_unrelated_blockers':p.get('unrelated_blocker_count'),
            'existing_rail_probe':p.get('existing_l101_to_c107_rail_preserved'),
            'added_segments':r.get('track_segments_added'),
            'vias_added':r.get('vias_added'),
            'track_width_mm':r.get('track_width_mm'),
            'track_length_mm':r.get('track_length_mm'),
            'component_moves':r.get('component_moves'),
            'component_rotations':r.get('component_rotations'),
            'c5_value':c.get('c5_value'),'l101_value':c.get('l101_value'),
            'c5_pad1_mm':c.get('c5_pad1_mm'),'l101_pad2_mm':c.get('l101_pad2_mm'),
            'c5_pad1_net':c.get('c5_pad1_net'),'l101_pad2_net':c.get('l101_pad2_net'),
            'c5_pad2_mm':c.get('c5_pad2_mm'),'c5_pad2_net':c.get('c5_pad2_net'),
            'l101_pad1_mm':c.get('l101_pad1_mm'),'l101_pad1_net':c.get('l101_pad1_net'),
            'c107_pad1_mm':c.get('c107_pad1_mm'),'c107_pad1_net':c.get('c107_pad1_net'),
            'existing_rail_status':r.get('existing_l101_to_c107_rail_status'),
            'c5_gnd_routing_touched':r.get('c5_gnd_routing_touched'),
            'pmic_sw1_routing_touched':r.get('pmic_sw1_routing_touched'),
            'accepted_route1bf_geometry_modified':r.get('accepted_route1bf_geometry_modified'),
            'rf_routing_touched':r.get('rf_routing_touched'),
            'supplier_gated_interfaces_touched':r.get('supplier_gated_interfaces_touched')
          }
          print(json.dumps(out,indent=2))
          Path('/tmp/route1bg-summary.json').write_text(json.dumps(out,indent=2))

          assert out['rule_violations']==0 and out['unconnected_items']==116
          assert out['pin_net_audit']=='PASS' and out['audited_nodes']==268
          assert out['probe_board_modified'] is False
          assert out['probe_unrelated_blockers']==0
          assert out['existing_rail_probe'] is True
          assert out['added_segments']==1 and out['vias_added']==0
          assert out['track_width_mm']==0.30 and abs(out['track_length_mm']-1.923385)<1e-6
          assert out['component_moves']==[] and out['component_rotations']==[]
          assert out['c5_value']=='100nF' and out['l101_value']=='2.2uH / DCR<400mR'
          assert out['c5_pad1_mm']==[9.255,22.225] and out['l101_pad2_mm']==[8.964712,24.126353]
          assert out['c5_pad1_net']=='+1V8' and out['l101_pad2_net']=='+1V8'
          assert out['c5_pad2_mm']==[9.895,22.225] and out['c5_pad2_net']=='GND'
          assert out['l101_pad1_mm']==[7.514712,24.126353] and out['l101_pad1_net']=='PMIC_SW1'
          assert out['c107_pad1_mm']==[10.407553,23.51711] and out['c107_pad1_net']=='+1V8'
          assert out['existing_rail_status']=='UNCHANGED'
          assert out['c5_gnd_routing_touched'] is False and out['pmic_sw1_routing_touched'] is False
          assert out['accepted_route1bf_geometry_modified'] is False
          assert out['rf_routing_touched'] is False and out['supplier_gated_interfaces_touched'] is False
          PY

      - name: Package route1bg evidence
        run: |
          mkdir -p /tmp/e
          cp hardware/main-board/pcb/route-r13-1bg/AegisBioWatch-MainBoard-Route1bg-r13.kicad_pcb /tmp/e/
          cp hardware/main-board/pcb/route-r13-1bg/AegisBioWatch-MainBoard-Route1bg-r13.kicad_pro /tmp/e/
          cp hardware/main-board/pcb/route-r13-1bg/routing-seed-r13-1bg.json /tmp/e/
          cp /tmp/route1bg.json /tmp/e/
          cp /tmp/route1bg-audit.json /tmp/e/
          cp /tmp/route1bg-summary.json /tmp/e/
          cp /tmp/route1bg-probe.json /tmp/e/
          (cd /tmp/e && sha256sum             AegisBioWatch-MainBoard-Route1bg-r13.kicad_pcb             AegisBioWatch-MainBoard-Route1bg-r13.kicad_pro             routing-seed-r13-1bg.json             route1bg.json route1bg-audit.json route1bg-summary.json route1bg-probe.json             > SHA256SUMS.txt)
          cat /tmp/e/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: r13-route1bg-c5-l101-1v8-evidence
          path: /tmp/e/**
          if-no-files-found: error

  verify-artifact:
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: r13-route1bg-c5-l101-1v8-evidence
          path: /tmp/e
      - name: Verify downloaded evidence package
        run: |
          cd /tmp/e
          sha256sum -c SHA256SUMS.txt
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('/tmp/e')
          d=json.loads((root/'route1bg.json').read_text())
          a=json.loads((root/'route1bg-audit.json').read_text())
          s=json.loads((root/'route1bg-summary.json').read_text())
          r=json.loads((root/'routing-seed-r13-1bg.json').read_text())
          p=json.loads((root/'route1bg-probe.json').read_text())
          pcb=root/'AegisBioWatch-MainBoard-Route1bg-r13.kicad_pcb'
          assert len(d.get('violations',[]))==0
          assert len(d.get('unconnected_items',[]))==116
          assert a.get('result')=='PASS' and a.get('audited_present_source_nodes')==268
          assert s.get('rule_violations')==0 and s.get('unconnected_items')==116
          assert s.get('pin_net_audit')=='PASS' and s.get('audited_nodes')==268
          assert s.get('probe_unrelated_blockers')==0
          assert r.get('track_segments_added')==1 and r.get('vias_added')==0
          assert r.get('output_sha256')==hashlib.sha256(pcb.read_bytes()).hexdigest()
          assert p.get('board_modified') is False and p.get('unrelated_blocker_count')==0
          print(json.dumps({
            'artifact_verify':'PASS',
            'rule_violations':0,
            'unconnected_items':116,
            'pin_net_audit':'PASS',
            'audited_nodes':268,
            'pcb_sha256':r.get('output_sha256')
          },indent=2))
          PY
