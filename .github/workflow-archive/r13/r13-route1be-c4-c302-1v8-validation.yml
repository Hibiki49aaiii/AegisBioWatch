name: r13 route1be C4-C302 +1V8 validation

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - '.github/workflows/r13-route1be-c4-c302-1v8-validation.yml'
      - 'tools/reproduce-route1bd-accepted.sh'
      - 'tools/probe-pcb-r13-route1be-c4-c302-1v8.py'
      - 'tools/materialize-pcb-r13-route1be-c4-c302-1v8.py'
      - 'tools/write-pcb-r13-route1be-report.py'
      - 'tools/audit-pcb-pin-nets.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install KiCad 9.0.9
        timeout-minutes: 45
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt
            test -s /etc/apt/apt-mirrors.txt
          fi
          sudo apt-get -o Acquire::Retries=5 update
          sudo apt-get -o Acquire::Retries=5 install -y software-properties-common
          sudo add-apt-repository --yes ppa:kicad/kicad-9.0-releases
          sudo apt-get -o Acquire::Retries=5 update
          sudo apt-get -o Acquire::Retries=5 install -y --no-install-recommends kicad kicad-footprints
          test "$(kicad-cli --version | head -n1)" = "9.0.9"
      - name: Reproduce accepted route1bd
        run: bash tools/reproduce-route1bd-accepted.sh
      - name: Re-run read-only route1be geometry probe
        run: |
          python3 tools/probe-pcb-r13-route1be-c4-c302-1v8.py             --route1bd-drc-json /tmp/route1bd.json             --route1bd-pin-net-audit /tmp/route1bd-audit.json             --output /tmp/route1be-probe.json
      - name: Materialize route1be
        run: |
          python3 -X faulthandler tools/materialize-pcb-r13-route1be-c4-c302-1v8.py             --route1bd-drc-json /tmp/route1bd.json             --route1bd-pin-net-audit /tmp/route1bd-audit.json
      - name: Validate route1be
        run: |
          kicad-cli pcb drc --format json --severity-all             -o /tmp/route1be.json             hardware/main-board/pcb/route-r13-1be/AegisBioWatch-MainBoard-Route1be-r13.kicad_pcb
          python3 tools/audit-pcb-pin-nets.py             --xml hardware/main-board/kicad/recovered-r8/AegisBioWatch-MainBoard-r8-recovered.xml             --pcb hardware/main-board/pcb/route-r13-1be/AegisBioWatch-MainBoard-Route1be-r13.kicad_pcb             --output /tmp/route1be-audit.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.load(open('/tmp/route1be.json'))
          a=json.load(open('/tmp/route1be-audit.json'))
          r=json.load(open('hardware/main-board/pcb/route-r13-1be/routing-seed-r13-1be.json'))
          c=r['connections']['C4.1/+1V8 to C302.1/+1V8']
          out={
            'rule_violations':len(d.get('violations',[])),
            'unconnected_items':len(d.get('unconnected_items',[])),
            'pin_net_audit':a.get('result'),
            'audited_nodes':a.get('audited_present_source_nodes'),
            'added_segments':r.get('track_segments_added'),
            'vias_added':r.get('vias_added'),
            'track_width_mm':r.get('track_width_mm'),
            'track_length_mm':r.get('track_length_mm'),
            'component_moves':r.get('component_moves'),
            'component_rotations':r.get('component_rotations'),
            'c4_value':c.get('c4_value'),'c302_value':c.get('c302_value'),
            'c4_pad1_mm':c.get('c4_pad1_mm'),'c302_pad1_mm':c.get('c302_pad1_mm'),
            'c4_pad1_net':c.get('c4_pad1_net'),'c302_pad1_net':c.get('c302_pad1_net'),
            'c4_pad2_mm':c.get('c4_pad2_mm'),'c302_pad2_mm':c.get('c302_pad2_mm'),
            'c4_pad2_net':c.get('c4_pad2_net'),'c302_pad2_net':c.get('c302_pad2_net'),
            'c4_gnd_escape_status':r.get('c4_gnd_escape_status'),
            'c302_gnd_escape_status':r.get('c302_gnd_escape_status'),
            'accepted_route1bd_geometry_modified':r.get('accepted_route1bd_geometry_modified'),
            'rf_routing_touched':r.get('rf_routing_touched'),
            'supplier_gated_interfaces_touched':r.get('supplier_gated_interfaces_touched')
          }
          print(json.dumps(out,indent=2))
          Path('/tmp/route1be-summary.json').write_text(json.dumps(out,indent=2))
          assert out['rule_violations']==0 and out['unconnected_items']==118
          assert out['pin_net_audit']=='PASS' and out['audited_nodes']==268
          assert out['added_segments']==1 and out['vias_added']==0 and out['track_width_mm']==0.30
          assert out['component_moves']==[] and out['component_rotations']==[]
          assert out['c4_value']=='100nF' and out['c302_value']=='1uF'
          assert out['c4_pad1_mm']==[41.005,14.975] and out['c302_pad1_mm']==[40.305,19.585]
          assert out['c4_pad1_net']=='+1V8' and out['c302_pad1_net']=='+1V8'
          assert out['c4_pad2_mm']==[41.645,14.975] and out['c302_pad2_mm']==[41.265,19.585]
          assert out['c4_pad2_net']=='GND' and out['c302_pad2_net']=='GND'
          assert out['c4_gnd_escape_status']=='UNCHANGED' and out['c302_gnd_escape_status']=='UNCHANGED'
          assert out['accepted_route1bd_geometry_modified'] is False
          assert out['rf_routing_touched'] is False and out['supplier_gated_interfaces_touched'] is False
          PY
      - name: Package route1be evidence
        run: |
          mkdir -p /tmp/e
          cp hardware/main-board/pcb/route-r13-1be/AegisBioWatch-MainBoard-Route1be-r13.kicad_pcb /tmp/e/
          cp hardware/main-board/pcb/route-r13-1be/AegisBioWatch-MainBoard-Route1be-r13.kicad_pro /tmp/e/
          cp hardware/main-board/pcb/route-r13-1be/routing-seed-r13-1be.json /tmp/e/
          cp /tmp/route1be.json /tmp/e/
          cp /tmp/route1be-audit.json /tmp/e/
          cp /tmp/route1be-summary.json /tmp/e/
          cp /tmp/route1be-probe.json /tmp/e/
          (cd /tmp/e && sha256sum AegisBioWatch-MainBoard-Route1be-r13.kicad_pcb             AegisBioWatch-MainBoard-Route1be-r13.kicad_pro             routing-seed-r13-1be.json route1be.json route1be-audit.json route1be-summary.json route1be-probe.json             > SHA256SUMS.txt)
          cat /tmp/e/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: r13-route1be-c4-c302-1v8-evidence
          path: /tmp/e/**
          if-no-files-found: error

  verify-artifact:
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: r13-route1be-c4-c302-1v8-evidence
          path: /tmp/e
      - name: Verify downloaded evidence package
        run: |
          cd /tmp/e
          sha256sum -c SHA256SUMS.txt
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('/tmp/e')
          d=json.loads((root/'route1be.json').read_text())
          a=json.loads((root/'route1be-audit.json').read_text())
          s=json.loads((root/'route1be-summary.json').read_text())
          r=json.loads((root/'routing-seed-r13-1be.json').read_text())
          p=json.loads((root/'route1be-probe.json').read_text())
          pcb=root/'AegisBioWatch-MainBoard-Route1be-r13.kicad_pcb'
          assert len(d.get('violations',[]))==0
          assert len(d.get('unconnected_items',[]))==118
          assert a.get('result')=='PASS' and a.get('audited_present_source_nodes')==268
          assert s.get('rule_violations')==0 and s.get('unconnected_items')==118
          assert s.get('pin_net_audit')=='PASS' and s.get('audited_nodes')==268
          assert r.get('track_segments_added')==1 and r.get('vias_added')==0
          assert r.get('output_sha256')==hashlib.sha256(pcb.read_bytes()).hexdigest()
          assert p.get('board_modified') is False
          assert p.get('C302',{}).get('pads',[{}])[0].get('net')=='+1V8'
          print(json.dumps({
            'artifact_verify':'PASS',
            'rule_violations':0,
            'unconnected_items':118,
            'pin_net_audit':'PASS',
            'audited_nodes':268,
            'pcb_sha256':r.get('output_sha256')
          },indent=2))
          PY
