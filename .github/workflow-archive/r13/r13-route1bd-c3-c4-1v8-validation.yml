name: r13 route1bd C3-C4 +1V8 validation

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - '.github/workflows/r13-route1bd-c3-c4-1v8-validation.yml'
      - 'tools/reproduce-route1bc-accepted.sh'
      - 'tools/materialize-pcb-r13-route1bd-c3-c4-1v8.py'
      - 'tools/write-pcb-r13-route1bd-report.py'
      - 'tools/audit-pcb-pin-nets.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install KiCad 9.0.9
        timeout-minutes: 45
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt
            test -s /etc/apt/apt-mirrors.txt
          fi
          sudo apt-get -o Acquire::Retries=5 update
          sudo apt-get -o Acquire::Retries=5 install -y software-properties-common
          sudo add-apt-repository --yes ppa:kicad/kicad-9.0-releases
          sudo apt-get -o Acquire::Retries=5 update
          sudo apt-get -o Acquire::Retries=5 install -y --no-install-recommends kicad kicad-footprints
          test "$(kicad-cli --version | head -n1)" = "9.0.9"
      - name: Reproduce accepted route1bc
        run: bash tools/reproduce-route1bc-accepted.sh
      - name: Materialize route1bd
        run: |
          python3 -X faulthandler tools/materialize-pcb-r13-route1bd-c3-c4-1v8.py             --route1bc-drc-json /tmp/route1bc.json             --route1bc-pin-net-audit /tmp/route1bc-audit.json
      - name: Validate route1bd
        run: |
          kicad-cli pcb drc --format json --severity-all -o /tmp/route1bd.json hardware/main-board/pcb/route-r13-1bd/AegisBioWatch-MainBoard-Route1bd-r13.kicad_pcb
          python3 tools/audit-pcb-pin-nets.py             --xml hardware/main-board/kicad/recovered-r8/AegisBioWatch-MainBoard-r8-recovered.xml             --pcb hardware/main-board/pcb/route-r13-1bd/AegisBioWatch-MainBoard-Route1bd-r13.kicad_pcb             --output /tmp/route1bd-audit.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.load(open('/tmp/route1bd.json'))
          a=json.load(open('/tmp/route1bd-audit.json'))
          r=json.load(open('hardware/main-board/pcb/route-r13-1bd/routing-seed-r13-1bd.json'))
          c=r['connections']['C3.1/+1V8 to C4.1/+1V8']
          out={
            'rule_violations':len(d.get('violations',[])),
            'unconnected_items':len(d.get('unconnected_items',[])),
            'pin_net_audit':a.get('result'),
            'audited_nodes':a.get('audited_present_source_nodes'),
            'added_segments':r.get('track_segments_added'),
            'vias_added':r.get('vias_added'),
            'track_width_mm':r.get('track_width_mm'),
            'component_moves':r.get('component_moves'),
            'component_rotations':r.get('component_rotations'),
            'c3_value':c.get('c3_value'),'c4_value':c.get('c4_value'),
            'c3_pad1_mm':c.get('c3_pad1_mm'),'c4_pad1_mm':c.get('c4_pad1_mm'),
            'c3_pad1_net':c.get('c3_pad1_net'),'c4_pad1_net':c.get('c4_pad1_net'),
            'c3_pad2_mm':c.get('c3_pad2_mm'),'c4_pad2_mm':c.get('c4_pad2_mm'),
            'c3_pad2_net':c.get('c3_pad2_net'),'c4_pad2_net':c.get('c4_pad2_net'),
            'accepted_route1bc_geometry_modified':r.get('accepted_route1bc_geometry_modified'),
            'rf_routing_touched':r.get('rf_routing_touched'),
            'supplier_gated_interfaces_touched':r.get('supplier_gated_interfaces_touched')}
          print(json.dumps(out,indent=2))
          Path('/tmp/route1bd-summary.json').write_text(json.dumps(out,indent=2))
          assert out['rule_violations']==0 and out['unconnected_items']==119
          assert out['pin_net_audit']=='PASS' and out['audited_nodes']==268
          assert out['added_segments']==1 and out['vias_added']==0 and out['track_width_mm']==0.30
          assert out['component_moves']==[] and out['component_rotations']==[]
          assert out['c3_value']=='100nF' and out['c4_value']=='100nF'
          assert out['c3_pad1_mm']==[41.005,13.475] and out['c4_pad1_mm']==[41.005,14.975]
          assert out['c3_pad1_net']=='+1V8' and out['c4_pad1_net']=='+1V8'
          assert out['c3_pad2_mm']==[41.645,13.475] and out['c4_pad2_mm']==[41.645,14.975]
          assert out['c3_pad2_net']=='GND' and out['c4_pad2_net']=='GND'
          assert out['accepted_route1bc_geometry_modified'] is False
          assert out['rf_routing_touched'] is False and out['supplier_gated_interfaces_touched'] is False
          PY
      - name: Package evidence
        if: always()
        run: |
          mkdir -p /tmp/e
          for f in             hardware/main-board/pcb/route-r13-1bd/AegisBioWatch-MainBoard-Route1bd-r13.kicad_pcb             hardware/main-board/pcb/route-r13-1bd/AegisBioWatch-MainBoard-Route1bd-r13.kicad_pro             hardware/main-board/pcb/route-r13-1bd/routing-seed-r13-1bd.json             /tmp/route1bd.json /tmp/route1bd-summary.json /tmp/route1bd-audit.json; do
            test -f "$f" && cp "$f" /tmp/e/
          done
          sha256sum /tmp/e/* > /tmp/e/SHA256SUMS.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r13-route1bd-c3-c4-1v8-evidence
          path: /tmp/e/**
          if-no-files-found: warn
