name: r13 route1bm current-state screening

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - '.github/workflows/r13-route1bm-current-screening.yml'
      - 'tools/reproduce-route1bl-accepted.sh'
      - 'tools/probe-pcb-r13-route1bm-current-doglegs.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screen:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install KiCad 9.0.9
        timeout-minutes: 45
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt
            test -s /etc/apt/apt-mirrors.txt
          fi
          sudo apt-get -o Acquire::Retries=5 update
          sudo apt-get -o Acquire::Retries=5 install -y software-properties-common
          sudo add-apt-repository --yes ppa:kicad/kicad-9.0-releases
          sudo apt-get -o Acquire::Retries=5 update
          sudo apt-get -o Acquire::Retries=5 install -y --no-install-recommends kicad kicad-footprints
          test "$(kicad-cli --version | head -n1)" = "9.0.9"

      - name: Reproduce accepted route1bl
        run: bash tools/reproduce-route1bl-accepted.sh

      - name: Screen current route1bm candidates read-only
        run: |
          python3 tools/probe-pcb-r13-route1bm-current-doglegs.py             --route1bl-drc-json /tmp/route1bl.json             --route1bl-pin-net-audit /tmp/route1bl-audit.json             --output /tmp/route1bm-current.json

          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/route1bm-current.json'))
          assert x['source_gate']=={
            'rule_violations':0,
            'unconnected_items':112,
            'pin_net_audit':'PASS',
            'audited_nodes':268
          }
          assert x['board_modified'] is False
          assert abs(x['grid_mm']-0.05)<1e-9
          assert abs(x['lane_margin_mm']-6.0)<1e-9
          assert abs(x['max_endpoint_distance_mm']-18.0)<1e-9
          assert x['raw_pair_count']>=100
          print('EVALUATED',x['evaluated_candidate_count'])
          print('PASSING',x['passing_candidate_count'])
          for i,c in enumerate(x['passing_candidates'][:30],1):
              p=c['best_passing_path']
              print(i,c['drc_index'],c['net'],c['a']['description'],'->',c['b']['description'],
                    'semantic',c['endpoint_semantic_rank'],
                    'family',p['path_family'],'segments',p['segment_count'],
                    'len',p['path_length_mm'],'clr',p['minimum_conservative_clearance_mm'],
                    'nearest',p['nearest_unrelated_copper'],
                    'points',p['points_mm'])
          print('EXCLUSIONS',x['exclusion_summary'])
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: r13-route1bm-current-screen
          path: /tmp/route1bm-current.json
          if-no-files-found: error
