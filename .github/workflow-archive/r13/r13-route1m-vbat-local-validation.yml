name: r13 route1m VBAT local validation

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - '.github/workflows/r13-route1m-vbat-local-validation.yml'
      - 'tools/reproduce-route1l-accepted.sh'
      - 'tools/materialize-pcb-r13-route1m-vbat-local.py'
      - 'tools/write-pcb-r13-route1m-report.py'
      - 'tools/audit-pcb-pin-nets.py'
  push:
    branches: [agent/phase1-mainboard-schematic]
    paths:
      - '.github/workflows/r13-route1m-vbat-local-validation.yml'
      - 'tools/reproduce-route1l-accepted.sh'
      - 'tools/materialize-pcb-r13-route1m-vbat-local.py'
      - 'tools/write-pcb-r13-route1m-report.py'
      - 'tools/audit-pcb-pin-nets.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install KiCad 9.0.9
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository --yes ppa:kicad/kicad-9.0-releases
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends kicad kicad-footprints
          test "$(kicad-cli --version | head -n1)" = "9.0.9"
      - name: Reproduce and validate accepted route1l baseline
        run: bash tools/reproduce-route1l-accepted.sh
      - name: Materialize route1m VBAT local closure
        run: |
          python3 -X faulthandler tools/materialize-pcb-r13-route1m-vbat-local.py \
            --route1l-drc-json /tmp/route1l.json \
            --route1l-pin-net-audit /tmp/route1l-audit.json
      - name: KiCad route1m DRC and audit
        run: |
          kicad-cli pcb drc --format json --severity-all -o /tmp/route1m.json hardware/main-board/pcb/route-r13-1m/AegisBioWatch-MainBoard-Route1m-r13.kicad_pcb
          python3 tools/audit-pcb-pin-nets.py \
            --xml hardware/main-board/kicad/recovered-r8/AegisBioWatch-MainBoard-r8-recovered.xml \
            --pcb hardware/main-board/pcb/route-r13-1m/AegisBioWatch-MainBoard-Route1m-r13.kicad_pcb \
            --output /tmp/route1m-audit.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.load(open('/tmp/route1m.json')); a=json.load(open('/tmp/route1m-audit.json')); r=json.load(open('hardware/main-board/pcb/route-r13-1m/routing-seed-r13-1m.json'))
          out={'rule_violations':len(d.get('violations',[])),'unconnected_items':len(d.get('unconnected_items',[])),'pin_net_audit':a.get('result'),'audited_nodes':a.get('audited_present_source_nodes'),'added_segments':r.get('track_segments_added'),'vias_added':r.get('vias_added'),'component_moves':r.get('component_moves'),'component_rotations':r.get('component_rotations')}
          print(json.dumps(out,indent=2)); Path('/tmp/route1m-summary.json').write_text(json.dumps(out,indent=2))
          if out['rule_violations']!=0 or out['unconnected_items']!=164: raise SystemExit('route1m DRC/ratsnest gate failed')
          if out['pin_net_audit']!='PASS' or out['audited_nodes']!=268: raise SystemExit('route1m audit gate failed')
          if out['added_segments']!=3 or out['vias_added']!=1: raise SystemExit('route1m routing scope gate failed')
          if out['component_moves']!=[]: raise SystemExit('route1m component-move gate failed')
          rot=out['component_rotations'] or {}
          if sorted(rot)!=['C106'] or rot['C106'].get('from_deg')!=90.0 or rot['C106'].get('to_deg')!=270.0: raise SystemExit('route1m rotation scope gate failed')
          PY
      - name: Package route1m evidence
        if: always()
        run: |
          mkdir -p /tmp/e
          for f in \
            hardware/main-board/pcb/route-r13-1m/AegisBioWatch-MainBoard-Route1m-r13.kicad_pcb \
            hardware/main-board/pcb/route-r13-1m/AegisBioWatch-MainBoard-Route1m-r13.kicad_pro \
            hardware/main-board/pcb/route-r13-1m/routing-seed-r13-1m.json \
            /tmp/route1m.json \
            /tmp/route1m-summary.json \
            /tmp/route1m-audit.json; do
            test -f "$f" && cp "$f" /tmp/e/
          done
          sha256sum /tmp/e/* > /tmp/e/SHA256SUMS.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r13-route1m-vbat-local-evidence
          path: /tmp/e/**
          if-no-files-found: warn
