name: r13 route1bb J9 left GND validation

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - '.github/workflows/r13-route1bb-j9-left-gnd-validation.yml'
      - 'tools/reproduce-route1ba-accepted.sh'
      - 'tools/materialize-pcb-r13-route1bb-j9-left-gnd.py'
      - 'tools/write-pcb-r13-route1bb-report.py'
      - 'tools/audit-pcb-pin-nets.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install KiCad 9.0.9
        timeout-minutes: 45
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository --yes ppa:kicad/kicad-9.0-releases
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends kicad kicad-footprints
          test "$(kicad-cli --version | head -n1)" = "9.0.9"
      - name: Reproduce accepted route1ba
        run: bash tools/reproduce-route1ba-accepted.sh
      - name: Materialize route1bb
        run: |
          python3 -X faulthandler tools/materialize-pcb-r13-route1bb-j9-left-gnd.py \
            --route1ba-drc-json /tmp/route1ba.json \
            --route1ba-pin-net-audit /tmp/route1ba-audit.json
      - name: Validate route1bb
        run: |
          kicad-cli pcb drc --format json --severity-all -o /tmp/route1bb.json hardware/main-board/pcb/route-r13-1bb/AegisBioWatch-MainBoard-Route1bb-r13.kicad_pcb
          python3 tools/audit-pcb-pin-nets.py \
            --xml hardware/main-board/kicad/recovered-r8/AegisBioWatch-MainBoard-r8-recovered.xml \
            --pcb hardware/main-board/pcb/route-r13-1bb/AegisBioWatch-MainBoard-Route1bb-r13.kicad_pcb \
            --output /tmp/route1bb-audit.json
          python3 -c "import json; d=json.load(open('/tmp/route1bb.json')); a=json.load(open('/tmp/route1bb-audit.json')); r=json.load(open('hardware/main-board/pcb/route-r13-1bb/routing-seed-r13-1bb.json')); assert len(d.get('violations',[]))==0; assert len(d.get('unconnected_items',[]))==121; assert a.get('result')=='PASS'; assert a.get('audited_present_source_nodes')==268; assert r.get('track_segments_added')==1; assert r.get('vias_added')==1; assert r.get('component_moves')==[]; assert r.get('component_rotations')==[]; print('route1bb PASS')"
      - name: Package evidence
        if: always()
        run: |
          mkdir -p /tmp/e
          cp hardware/main-board/pcb/route-r13-1bb/AegisBioWatch-MainBoard-Route1bb-r13.kicad_pcb /tmp/e/ || true
          cp hardware/main-board/pcb/route-r13-1bb/AegisBioWatch-MainBoard-Route1bb-r13.kicad_pro /tmp/e/ || true
          cp hardware/main-board/pcb/route-r13-1bb/routing-seed-r13-1bb.json /tmp/e/ || true
          cp /tmp/route1bb.json /tmp/e/ || true
          cp /tmp/route1bb-audit.json /tmp/e/ || true
          sha256sum /tmp/e/* > /tmp/e/SHA256SUMS.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r13-route1bb-j9-left-gnd-evidence
          path: /tmp/e/**
          if-no-files-found: warn
