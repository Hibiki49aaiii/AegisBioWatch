name: r13 route1bl R106 VSYS validation

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - '.github/workflows/r13-route1bl-r106-vsys-validation.yml'
      - 'tools/reproduce-route1bk-accepted.sh'
      - 'tools/probe-pcb-r13-route1bl-r106-vsys-refine.py'
      - 'tools/probe-pcb-r13-route1bl-r106-vsys.py'
      - 'tools/materialize-pcb-r13-route1bl-r106-vsys.py'
      - 'tools/write-pcb-r13-route1bl-report.py'
      - 'tools/audit-pcb-pin-nets.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install KiCad 9.0.9
        timeout-minutes: 45
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt
            test -s /etc/apt/apt-mirrors.txt
          fi
          sudo apt-get -o Acquire::Retries=5 update
          sudo apt-get -o Acquire::Retries=5 install -y software-properties-common
          sudo add-apt-repository --yes ppa:kicad/kicad-9.0-releases
          sudo apt-get -o Acquire::Retries=5 update
          sudo apt-get -o Acquire::Retries=5 install -y --no-install-recommends kicad kicad-footprints
          test "$(kicad-cli --version | head -n1)" = "9.0.9"

      - name: Reproduce accepted route1bk
        run: bash tools/reproduce-route1bk-accepted.sh

      - name: Re-run route1bl local refine
        run: |
          python3 tools/probe-pcb-r13-route1bl-r106-vsys-refine.py             --route1bk-drc-json /tmp/route1bk.json             --route1bk-pin-net-audit /tmp/route1bk-audit.json             --output /tmp/route1bl-refine.json

          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/route1bl-refine.json'))
          assert x['source_gate']=={
            'rule_violations':0,
            'unconnected_items':113,
            'pin_net_audit':'PASS',
            'audited_nodes':268
          }
          assert x['board_modified'] is False
          b=x['best_passing_path']
          assert b['points_mm']==[
            [8.9875,28.25],
            [7.2,28.25],
            [7.2,26.4],
            [5.270826,26.4],
            [5.270826,25.865834]
          ]
          assert b['path_family']=='HVHV'
          assert b['segment_count']==4
          assert abs(b['minimum_conservative_clearance_mm']-0.184166)<1e-6
          assert x['passing_path_count']>=16
          print('route1bl_refine: PASS')
          PY

      - name: Run exact route1bl probe
        run: |
          python3 tools/probe-pcb-r13-route1bl-r106-vsys.py             --route1bk-drc-json /tmp/route1bk.json             --route1bk-pin-net-audit /tmp/route1bk-audit.json             --refine-json /tmp/route1bl-refine.json             --output /tmp/route1bl-probe.json

          python3 - <<'PY'
          import json
          p=json.load(open('/tmp/route1bl-probe.json'))
          e=p['effective_new_copper_path']
          assert p['board_modified'] is False
          assert p['R106_value']=='0R DNP/OPTION'
          assert p['R106_pad1_mm']==[5.270826,25.865834] and p['R106_pad1_net']=='VSYS'
          assert p['R106_pad2_mm']==[5.910826,25.865834] and p['R106_pad2_net']=='LDO2_IN'
          assert p['source_track']=={
            'start_mm':[8.9875,28.25],
            'end_mm':[7.35,28.25],
            'width_mm':0.3,
            'net':'VSYS'
          }
          assert e['points_mm']==[
            [7.35,28.25],
            [7.2,28.25],
            [7.2,26.4],
            [5.270826,26.4],
            [5.270826,25.865834]
          ]
          assert e['segment_count']==4
          assert e['segment_lengths_mm']==[0.15,1.85,1.929174,0.534166]
          assert abs(e['total_length_mm']-4.46334)<1e-6
          assert abs(e['minimum_conservative_clearance_mm']-0.184166)<1e-6
          assert abs(e['independent_r106p2_gap_mm']-0.184166)<1e-6
          assert p['accepted_source_track_overlap_materialized'] is False
          print('route1bl_exact_probe: PASS')
          PY

      - name: Materialize route1bl
        run: |
          python3 -X faulthandler tools/materialize-pcb-r13-route1bl-r106-vsys.py             --route1bk-drc-json /tmp/route1bk.json             --route1bk-pin-net-audit /tmp/route1bk-audit.json             --exact-probe-json /tmp/route1bl-probe.json

      - name: Audit exact physical delta
        run: |
          python3 - <<'PY'
          import collections,json
          from pathlib import Path
          import pcbnew

          src=pcbnew.LoadBoard('hardware/main-board/pcb/route-r13-1bk/AegisBioWatch-MainBoard-Route1bk-r13.kicad_pcb')
          out=pcbnew.LoadBoard('hardware/main-board/pcb/route-r13-1bl/AegisBioWatch-MainBoard-Route1bl-r13.kicad_pcb')

          def mm(v): return round(float(pcbnew.ToMM(v)),6)
          def xy(v): return (mm(v.x),mm(v.y))
          def canon(a,b): return tuple(sorted((a,b)))

          def track_sig(item):
              if isinstance(item,pcbnew.PCB_VIA):
                  return ('VIA',item.GetNetname(),xy(item.GetPosition()),mm(item.GetWidth()),mm(item.GetDrillValue()))
              return (
                  type(item).__name__,
                  item.GetNetname(),
                  int(item.GetLayer()),
                  canon(xy(item.GetStart()),xy(item.GetEnd())),
                  mm(item.GetWidth())
              )

          def fp_state(board):
              d={}
              for fp in board.GetFootprints():
                  o=fp.GetOrientation()
                  deg=float(o.AsDegrees()) if hasattr(o,'AsDegrees') else float(fp.GetOrientationDegrees())
                  d[fp.GetReference()]=(xy(fp.GetPosition()),round(deg,6))
              return d

          s=collections.Counter(track_sig(x) for x in src.GetTracks())
          o=collections.Counter(track_sig(x) for x in out.GetTracks())
          removed=list((s-o).elements())
          added=list((o-s).elements())

          expected_points=[
              ((7.35,28.25),(7.2,28.25)),
              ((7.2,28.25),(7.2,26.4)),
              ((7.2,26.4),(5.270826,26.4)),
              ((5.270826,26.4),(5.270826,25.865834)),
          ]
          expected=[
              ('PCB_TRACK','VSYS',int(pcbnew.F_Cu),canon(a,b),0.3)
              for a,b in expected_points
          ]

          assert removed==[], removed
          assert collections.Counter(added)==collections.Counter(expected), added
          assert all(x[0] != 'VIA' for x in added)
          assert fp_state(src)==fp_state(out)

          # Existing source segment must remain exactly once.
          source_sig=('PCB_TRACK','VSYS',int(pcbnew.F_Cu),canon((8.9875,28.25),(7.35,28.25)),0.3)
          assert s[source_sig]==1 and o[source_sig]==1

          scope={
              'removed_items':removed,
              'added_items':[list(x) for x in added],
              'added_track_count':len(added),
              'added_via_count':0,
              'footprint_state_unchanged':True,
              'existing_vsys_source_track_count_before':s[source_sig],
              'existing_vsys_source_track_count_after':o[source_sig],
              'result':'PASS'
          }
          Path('/tmp/route1bl-scope.json').write_text(json.dumps(scope,indent=2)+'\n')
          print(json.dumps(scope,indent=2))
          PY

      - name: Validate route1bl
        run: |
          kicad-cli pcb drc --format json --severity-all             -o /tmp/route1bl.json             hardware/main-board/pcb/route-r13-1bl/AegisBioWatch-MainBoard-Route1bl-r13.kicad_pcb

          python3 tools/audit-pcb-pin-nets.py             --xml hardware/main-board/kicad/recovered-r8/AegisBioWatch-MainBoard-r8-recovered.xml             --pcb hardware/main-board/pcb/route-r13-1bl/AegisBioWatch-MainBoard-Route1bl-r13.kicad_pcb             --output /tmp/route1bl-audit.json

          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path

          d=json.load(open('/tmp/route1bl.json'))
          a=json.load(open('/tmp/route1bl-audit.json'))
          p=json.load(open('/tmp/route1bl-probe.json'))
          f=json.load(open('/tmp/route1bl-refine.json'))
          q=json.load(open('/tmp/route1bl-scope.json'))
          r=json.load(open('hardware/main-board/pcb/route-r13-1bl/routing-seed-r13-1bl.json'))
          c=r['connections']['accepted VSYS source endpoint to R106.1/VSYS']
          pcb=Path('hardware/main-board/pcb/route-r13-1bl/AegisBioWatch-MainBoard-Route1bl-r13.kicad_pcb')

          out={
            'rule_violations':len(d.get('violations',[])),
            'unconnected_items':len(d.get('unconnected_items',[])),
            'pin_net_audit':a.get('result'),
            'audited_nodes':a.get('audited_present_source_nodes'),
            'mismatches':a.get('mismatches',[]),
            'unexpected_pad_nets':a.get('unexpected_pad_nets',[]),
            'refine_board_modified':f.get('board_modified'),
            'refine_passing_paths':f.get('passing_path_count'),
            'refine_best_clearance_mm':f.get('best_passing_path',{}).get('minimum_conservative_clearance_mm'),
            'probe_board_modified':p.get('board_modified'),
            'probe_min_clearance_mm':p.get('effective_new_copper_path',{}).get('minimum_conservative_clearance_mm'),
            'probe_r106p2_gap_mm':p.get('effective_new_copper_path',{}).get('independent_r106p2_gap_mm'),
            'segments_added':r.get('track_segments_added'),
            'vias_added':r.get('vias_added'),
            'track_width_mm':r.get('track_width_mm'),
            'segment_lengths_mm':r.get('segment_lengths_mm'),
            'track_length_mm':r.get('track_length_mm'),
            'path_points_mm':c.get('path_points_mm'),
            'r106_value':c.get('r106_value'),
            'r106_pad1_mm':c.get('r106_pad1_mm'),
            'r106_pad1_net':c.get('r106_pad1_net'),
            'r106_pad2_mm':c.get('r106_pad2_mm'),
            'r106_pad2_net':c.get('r106_pad2_net'),
            'r106_pad2_routing_touched':c.get('r106_pad2_routing_touched'),
            'source_existing_track_modified':c.get('source_existing_track_modified'),
            'component_moves':r.get('component_moves'),
            'component_rotations':r.get('component_rotations'),
            'accepted_route1bk_geometry_modified':r.get('accepted_route1bk_geometry_modified'),
            'existing_vsys_source_track_modified':r.get('existing_vsys_source_track_modified'),
            'r106_ldo2_in_routing_touched':r.get('r106_ldo2_in_routing_touched'),
            'rf_routing_touched':r.get('rf_routing_touched'),
            'supplier_gated_interfaces_touched':r.get('supplier_gated_interfaces_touched'),
            'scope_result':q.get('result'),
            'scope_added_track_count':q.get('added_track_count'),
            'scope_added_via_count':q.get('added_via_count'),
            'scope_footprint_state_unchanged':q.get('footprint_state_unchanged'),
            'pcb_sha256':hashlib.sha256(pcb.read_bytes()).hexdigest()
          }
          print(json.dumps(out,indent=2))
          Path('/tmp/route1bl-summary.json').write_text(json.dumps(out,indent=2)+'\n')

          assert out['rule_violations']==0
          assert out['unconnected_items']==112
          assert out['pin_net_audit']=='PASS' and out['audited_nodes']==268
          assert out['mismatches']==[] and out['unexpected_pad_nets']==[]
          assert out['refine_board_modified'] is False and out['probe_board_modified'] is False
          assert out['refine_passing_paths']>=16
          assert abs(out['refine_best_clearance_mm']-0.184166)<1e-6
          assert abs(out['probe_min_clearance_mm']-0.184166)<1e-6
          assert abs(out['probe_r106p2_gap_mm']-0.184166)<1e-6
          assert out['segments_added']==4 and out['vias_added']==0
          assert out['track_width_mm']==0.30
          assert out['segment_lengths_mm']==[0.15,1.85,1.929174,0.534166]
          assert abs(out['track_length_mm']-4.46334)<1e-6
          assert out['path_points_mm']==[
            [7.35,28.25],[7.2,28.25],[7.2,26.4],[5.270826,26.4],[5.270826,25.865834]
          ]
          assert out['r106_value']=='0R DNP/OPTION'
          assert out['r106_pad1_mm']==[5.270826,25.865834] and out['r106_pad1_net']=='VSYS'
          assert out['r106_pad2_mm']==[5.910826,25.865834] and out['r106_pad2_net']=='LDO2_IN'
          assert out['r106_pad2_routing_touched'] is False
          assert out['source_existing_track_modified'] is False
          assert out['component_moves']==[] and out['component_rotations']==[]
          assert out['accepted_route1bk_geometry_modified'] is False
          assert out['existing_vsys_source_track_modified'] is False
          assert out['r106_ldo2_in_routing_touched'] is False
          assert out['rf_routing_touched'] is False
          assert out['supplier_gated_interfaces_touched'] is False
          assert out['scope_result']=='PASS'
          assert out['scope_added_track_count']==4 and out['scope_added_via_count']==0
          assert out['scope_footprint_state_unchanged'] is True
          assert r.get('output_sha256')==out['pcb_sha256']
          PY

      - name: Package route1bl evidence
        run: |
          mkdir -p /tmp/e
          cp hardware/main-board/pcb/route-r13-1bl/AegisBioWatch-MainBoard-Route1bl-r13.kicad_pcb /tmp/e/
          cp hardware/main-board/pcb/route-r13-1bl/AegisBioWatch-MainBoard-Route1bl-r13.kicad_pro /tmp/e/
          cp hardware/main-board/pcb/route-r13-1bl/routing-seed-r13-1bl.json /tmp/e/
          cp /tmp/route1bl.json /tmp/e/
          cp /tmp/route1bl-audit.json /tmp/e/
          cp /tmp/route1bl-summary.json /tmp/e/
          cp /tmp/route1bl-probe.json /tmp/e/
          cp /tmp/route1bl-refine.json /tmp/e/
          cp /tmp/route1bl-scope.json /tmp/e/
          (cd /tmp/e && sha256sum             AegisBioWatch-MainBoard-Route1bl-r13.kicad_pcb             AegisBioWatch-MainBoard-Route1bl-r13.kicad_pro             routing-seed-r13-1bl.json             route1bl.json route1bl-audit.json route1bl-summary.json             route1bl-probe.json route1bl-refine.json route1bl-scope.json > SHA256SUMS.txt)
          cat /tmp/e/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: r13-route1bl-r106-vsys-evidence
          path: /tmp/e/**
          if-no-files-found: error

  verify-artifact:
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: r13-route1bl-r106-vsys-evidence
          path: /tmp/e

      - name: Verify downloaded route1bl evidence
        run: |
          cd /tmp/e
          sha256sum -c SHA256SUMS.txt
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('/tmp/e')
          d=json.loads((root/'route1bl.json').read_text())
          a=json.loads((root/'route1bl-audit.json').read_text())
          s=json.loads((root/'route1bl-summary.json').read_text())
          p=json.loads((root/'route1bl-probe.json').read_text())
          f=json.loads((root/'route1bl-refine.json').read_text())
          q=json.loads((root/'route1bl-scope.json').read_text())
          r=json.loads((root/'routing-seed-r13-1bl.json').read_text())
          pcb=root/'AegisBioWatch-MainBoard-Route1bl-r13.kicad_pcb'

          assert len(d.get('violations',[]))==0
          assert len(d.get('unconnected_items',[]))==112
          assert a.get('result')=='PASS' and a.get('audited_present_source_nodes')==268
          assert a.get('mismatches',[])==[] and a.get('unexpected_pad_nets',[])==[]
          assert s.get('rule_violations')==0 and s.get('unconnected_items')==112
          assert s.get('pin_net_audit')=='PASS' and s.get('audited_nodes')==268
          assert f.get('board_modified') is False
          assert p.get('board_modified') is False
          assert abs(p.get('effective_new_copper_path',{}).get('minimum_conservative_clearance_mm')-0.184166)<1e-6
          assert abs(p.get('effective_new_copper_path',{}).get('independent_r106p2_gap_mm')-0.184166)<1e-6
          assert q.get('result')=='PASS'
          assert q.get('added_track_count')==4 and q.get('added_via_count')==0
          assert q.get('footprint_state_unchanged') is True
          assert r.get('track_segments_added')==4 and r.get('vias_added')==0
          assert r.get('segment_lengths_mm')==[0.15,1.85,1.929174,0.534166]
          assert abs(r.get('track_length_mm')-4.46334)<1e-6
          assert r.get('output_sha256')==hashlib.sha256(pcb.read_bytes()).hexdigest()
          print(json.dumps({
            'artifact_verify':'PASS',
            'rule_violations':0,
            'unconnected_items':112,
            'pin_net_audit':'PASS',
            'audited_nodes':268,
            'minimum_conservative_clearance_mm':p.get('effective_new_copper_path',{}).get('minimum_conservative_clearance_mm'),
            'independent_r106p2_gap_mm':p.get('effective_new_copper_path',{}).get('independent_r106p2_gap_mm'),
            'scope_result':q.get('result'),
            'pcb_sha256':r.get('output_sha256')
          },indent=2))
          PY
