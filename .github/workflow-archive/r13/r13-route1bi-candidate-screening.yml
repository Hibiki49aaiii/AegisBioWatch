name: r13 route1bi candidate screening

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - '.github/workflows/r13-route1bi-candidate-screening.yml'
      - 'tools/reproduce-route1bg-accepted.sh'
      - 'tools/probe-pcb-r13-route1bi-candidates.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screen:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install KiCad 9.0.9
        timeout-minutes: 45
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt
            test -s /etc/apt/apt-mirrors.txt
          fi
          sudo apt-get -o Acquire::Retries=5 update
          sudo apt-get -o Acquire::Retries=5 install -y software-properties-common
          sudo add-apt-repository --yes ppa:kicad/kicad-9.0-releases
          sudo apt-get -o Acquire::Retries=5 update
          sudo apt-get -o Acquire::Retries=5 install -y --no-install-recommends kicad kicad-footprints
          test "$(kicad-cli --version | head -n1)" = "9.0.9"

      - name: Reproduce accepted route1bg
        run: bash tools/reproduce-route1bg-accepted.sh

      - name: Screen route1bi candidates read-only
        run: |
          python3 tools/probe-pcb-r13-route1bi-candidates.py             --route1bg-drc-json /tmp/route1bg.json             --route1bg-pin-net-audit /tmp/route1bg-audit.json             --output /tmp/route1bi-screen.json
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/route1bi-screen.json'))
          assert x['source_gate']=={'rule_violations':0,'unconnected_items':116,'pin_net_audit':'PASS','audited_nodes':268}
          assert x['board_modified'] is False
          assert x['candidate_count']==7
          print('PASSING',x['passing_candidate_ids'])
          for i,c in enumerate(x['ranked_candidates'],1):
              print(i,c['id'],c['minimum_conservative_clearance_mm'],c['length_mm'],c['rule_pass'])
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: r13-route1bi-candidate-screen
          path: /tmp/route1bi-screen.json
          if-no-files-found: error
