name: r13 route1az R304 GND validation

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - '.github/workflows/r13-route1az-r304-gnd-validation.yml'
      - 'tools/reproduce-route1ay-accepted.sh'
      - 'tools/materialize-pcb-r13-route1az-r304-gnd.py'
      - 'tools/write-pcb-r13-route1az-report.py'
      - 'tools/audit-pcb-pin-nets.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install KiCad 9.0.9
        timeout-minutes: 45
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt
            test -s /etc/apt/apt-mirrors.txt
          fi
          sudo apt-get -o Acquire::Retries=5 update
          sudo apt-get -o Acquire::Retries=5 install -y software-properties-common
          sudo add-apt-repository --yes ppa:kicad/kicad-9.0-releases
          sudo apt-get -o Acquire::Retries=5 update
          sudo apt-get -o Acquire::Retries=5 install -y --no-install-recommends kicad kicad-footprints
          test "$(kicad-cli --version | head -n1)" = "9.0.9"
      - name: Reproduce and validate accepted route1ay baseline
        run: bash tools/reproduce-route1ay-accepted.sh
      - name: Materialize route1az R304 GND closure
        run: |
          python3 -X faulthandler tools/materialize-pcb-r13-route1az-r304-gnd.py \
            --route1ay-drc-json /tmp/route1ay.json \
            --route1ay-pin-net-audit /tmp/route1ay-audit.json
      - name: KiCad route1az DRC and audit
        run: |
          kicad-cli pcb drc --format json --severity-all -o /tmp/route1az.json hardware/main-board/pcb/route-r13-1az/AegisBioWatch-MainBoard-Route1az-r13.kicad_pcb
          python3 tools/audit-pcb-pin-nets.py \
            --xml hardware/main-board/kicad/recovered-r8/AegisBioWatch-MainBoard-r8-recovered.xml \
            --pcb hardware/main-board/pcb/route-r13-1az/AegisBioWatch-MainBoard-Route1az-r13.kicad_pcb \
            --output /tmp/route1az-audit.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.load(open('/tmp/route1az.json')); a=json.load(open('/tmp/route1az-audit.json'))
          r=json.load(open('hardware/main-board/pcb/route-r13-1az/routing-seed-r13-1az.json'))
          c=r.get('connections',{}).get('R304.2/GND',{})
          out={'rule_violations':len(d.get('violations',[])),'unconnected_items':len(d.get('unconnected_items',[])),
            'pin_net_audit':a.get('result'),'audited_nodes':a.get('audited_present_source_nodes'),
            'added_segments':r.get('track_segments_added'),'vias_added':r.get('vias_added'),
            'component_moves':r.get('component_moves'),'component_rotations':r.get('component_rotations'),
            'r304_value':c.get('r304_value'),'r304_1_net':c.get('r304_1_net'),'r304_2_net':c.get('r304_2_net'),
            'r304_1_pad_mm':c.get('r304_1_pad_mm'),'r304_2_pad_mm':c.get('r304_2_pad_mm'),
            'target_pad_mm':c.get('pad_mm'),'gnd_via_mm':c.get('gnd_via_mm'),
            'accepted_route1ay_geometry_modified':r.get('accepted_route1ay_geometry_modified'),
            'rf_routing_touched':r.get('rf_routing_touched'),'supplier_gated_interfaces_touched':r.get('supplier_gated_interfaces_touched')}
          print(json.dumps(out,indent=2)); Path('/tmp/route1az-summary.json').write_text(json.dumps(out,indent=2))
          if out['rule_violations']!=0 or out['unconnected_items']!=123: raise SystemExit('route1az DRC/ratsnest gate failed')
          if out['pin_net_audit']!='PASS' or out['audited_nodes']!=268: raise SystemExit('route1az audit gate failed')
          if out['added_segments']!=1 or out['vias_added']!=1: raise SystemExit('route1az routing scope gate failed')
          if out['component_moves']!=[] or out['component_rotations']!=[]: raise SystemExit('route1az placement scope gate failed')
          expected={'r304_value':'100k PD','r304_1_net':'HAPTIC_EN','r304_2_net':'GND'}
          for key,value in expected.items():
              if out[key]!=value: raise SystemExit(f'route1az R304 identity/net gate failed: {key}={out[key]!r}')
          if out['r304_1_pad_mm'] != [24.755,25.975] or out['r304_2_pad_mm'] != [25.395,25.975]: raise SystemExit('route1az R304 geometry gate failed')
          if out['target_pad_mm'] != [25.395,25.975] or out['gnd_via_mm'] != [25.395,26.63]: raise SystemExit('route1az target geometry gate failed')
          if out['accepted_route1ay_geometry_modified'] is not False: raise SystemExit('route1az accepted route1ay geometry mutation gate failed')
          if out['rf_routing_touched'] is not False or out['supplier_gated_interfaces_touched'] is not False: raise SystemExit('route1az frozen-interface scope gate failed')
          PY
      - name: Package route1az evidence
        if: always()
        run: |
          mkdir -p /tmp/e
          for f in \
            hardware/main-board/pcb/route-r13-1az/AegisBioWatch-MainBoard-Route1az-r13.kicad_pcb \
            hardware/main-board/pcb/route-r13-1az/AegisBioWatch-MainBoard-Route1az-r13.kicad_pro \
            hardware/main-board/pcb/route-r13-1az/routing-seed-r13-1az.json \
            /tmp/route1az.json /tmp/route1az-summary.json /tmp/route1az-audit.json; do
            test -f "$f" && cp "$f" /tmp/e/
          done
          sha256sum /tmp/e/* > /tmp/e/SHA256SUMS.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r13-route1az-r304-gnd-evidence
          path: /tmp/e/**
          if-no-files-found: warn
