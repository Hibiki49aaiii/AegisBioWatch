name: r13 route1am C1 GND validation

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - '.github/workflows/r13-route1am-c1-gnd-validation.yml'
      - 'tools/reproduce-route1al-accepted.sh'
      - 'tools/materialize-pcb-r13-route1am-c1-gnd.py'
      - 'tools/write-pcb-r13-route1am-report.py'
      - 'tools/audit-pcb-pin-nets.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install KiCad 9.0.9
        timeout-minutes: 45
        run: |
          sudo apt-get -o Acquire::Retries=5 update
          sudo apt-get -o Acquire::Retries=5 install -y software-properties-common
          sudo add-apt-repository --yes ppa:kicad/kicad-9.0-releases
          sudo apt-get -o Acquire::Retries=5 update
          sudo apt-get -o Acquire::Retries=5 install -y --no-install-recommends kicad kicad-footprints
          test "$(kicad-cli --version | head -n1)" = "9.0.9"
      - name: Reproduce and validate accepted route1al baseline
        run: bash tools/reproduce-route1al-accepted.sh
      - name: Materialize route1am C1 GND closure
        run: |
          python3 -X faulthandler tools/materialize-pcb-r13-route1am-c1-gnd.py \
            --route1al-drc-json /tmp/route1al.json \
            --route1al-pin-net-audit /tmp/route1al-audit.json
      - name: KiCad route1am DRC and audit
        run: |
          kicad-cli pcb drc --format json --severity-all -o /tmp/route1am.json hardware/main-board/pcb/route-r13-1am/AegisBioWatch-MainBoard-Route1am-r13.kicad_pcb
          python3 tools/audit-pcb-pin-nets.py \
            --xml hardware/main-board/kicad/recovered-r8/AegisBioWatch-MainBoard-r8-recovered.xml \
            --pcb hardware/main-board/pcb/route-r13-1am/AegisBioWatch-MainBoard-Route1am-r13.kicad_pcb \
            --output /tmp/route1am-audit.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.load(open('/tmp/route1am.json')); a=json.load(open('/tmp/route1am-audit.json')); r=json.load(open('hardware/main-board/pcb/route-r13-1am/routing-seed-r13-1am.json'))
          out={'rule_violations':len(d.get('violations',[])),'unconnected_items':len(d.get('unconnected_items',[])),'pin_net_audit':a.get('result'),'audited_nodes':a.get('audited_present_source_nodes'),'added_segments':r.get('track_segments_added'),'vias_added':r.get('vias_added'),'component_moves':r.get('component_moves'),'component_rotations':r.get('component_rotations')}
          print(json.dumps(out,indent=2)); Path('/tmp/route1am-summary.json').write_text(json.dumps(out,indent=2))
          if out['rule_violations']!=0 or out['unconnected_items']!=136: raise SystemExit('route1am DRC/ratsnest gate failed')
          if out['pin_net_audit']!='PASS' or out['audited_nodes']!=268: raise SystemExit('route1am audit gate failed')
          if out['added_segments']!=1 or out['vias_added']!=1: raise SystemExit('route1am routing scope gate failed')
          if out['component_moves']!=[] or out['component_rotations']!=[]: raise SystemExit('route1am placement scope gate failed')
          PY
      - name: Package route1am evidence
        if: always()
        run: |
          mkdir -p /tmp/e
          for f in \
            hardware/main-board/pcb/route-r13-1am/AegisBioWatch-MainBoard-Route1am-r13.kicad_pcb \
            hardware/main-board/pcb/route-r13-1am/AegisBioWatch-MainBoard-Route1am-r13.kicad_pro \
            hardware/main-board/pcb/route-r13-1am/routing-seed-r13-1am.json \
            /tmp/route1am.json /tmp/route1am-summary.json /tmp/route1am-audit.json; do
            test -f "$f" && cp "$f" /tmp/e/
          done
          sha256sum /tmp/e/* > /tmp/e/SHA256SUMS.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r13-route1am-c1-gnd-evidence
          path: /tmp/e/**
          if-no-files-found: warn
